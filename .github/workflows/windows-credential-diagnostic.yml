name: Windows credential diagnostic
on:
  workflow_dispatch:
  push:
    branches: [chore/upstream-catchup-2026-09]
    paths:
      - .github/workflows/windows-credential-diagnostic.yml
      - packages/core/script/windows-credential-smoke.ts
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip
      - name: Isolated native phases (no dependency install or app startup)
        run: bun packages/core/script/windows-credential-smoke.ts --diagnose
