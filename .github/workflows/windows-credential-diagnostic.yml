name: Windows credential diagnostic
on:
  workflow_dispatch:
  push:
    branches: [chore/upstream-catchup-2026-09]
    paths:
      - .github/workflows/windows-credential-diagnostic.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        id: setup
      - name: Compare explicit module import and in-memory compiler controls
        shell: bash
        run: |
          bun packages/core/script/windows-compiler-diagnostic.ts
