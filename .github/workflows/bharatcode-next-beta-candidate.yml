name: BharatCode next-beta artifact candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex contained Windows hotfix source to build without publication
        required: true
        type: string
      wsl_acceptance_mode:
        description: Require formal WSL2 automation, or record the owner's migration-corrected 1.15.23 hotfix waiver
        required: true
        default: required
        type: choice
        options:
          - required
          - owner-waived-hotfix-1.15.23

permissions:
  contents: read

env:
  ACCEPTED_HOTFIX_PARENT_SHA: 14046b6b4a5a7fd35ab6e7cfd0ac4655a6c8ca8e
  ACCEPTED_WSL_SOURCE_SHA: 205e5f670fae8e18e49f58b504b630cbe255da2d
  BHARATCODE_CHANNEL: beta
  OPENCODE_CHANNEL: beta
  SOURCE_SHA: ${{ inputs.source_sha }}
  VITE_OPENCODE_CHANNEL: beta
  WORKFLOW_PATH: .github/workflows/bharatcode-next-beta-candidate.yml

jobs:
  admit-source:
    if: github.ref == 'refs/heads/codex/desktop-1.15.23-migration-hotfix'
    runs-on: ubuntu-24.04
    outputs:
      candidate_tag: ${{ steps.identity.outputs.candidate_tag }}
      cli_version: ${{ steps.identity.outputs.cli_version }}
      desktop_version: ${{ steps.identity.outputs.desktop_version }}
      wsl_runtime_version: ${{ steps.identity.outputs.wsl_runtime_version }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Admit immutable source and source-derived versions
        id: identity
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WSL_ACCEPTANCE_MODE: ${{ inputs.wsl_acceptance_mode }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_SHA" == "$SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git status --porcelain)" == "" ]]
          git merge-base --is-ancestor "$ACCEPTED_WSL_SOURCE_SHA" "$SOURCE_SHA"
          [[ "$(git rev-parse "$SOURCE_SHA^")" == "$ACCEPTED_HOTFIX_PARENT_SHA" ]]
          [[ "$(git diff --name-only "$ACCEPTED_WSL_SOURCE_SHA" "$SOURCE_SHA")" == $'.github/workflows/bharatcode-next-beta-candidate.yml\nbun.lock\npackages/desktop/package.json\npackages/desktop/scripts/lean-upgrade-acceptance.mjs\npackages/desktop/scripts/lean-upgrade-acceptance.test.ts\npackages/desktop/scripts/lean-upgrade-receipt.mjs\npackages/desktop/scripts/lean-upgrade-receipt.test.ts\npackages/opencode/script/lean-cohort.mjs\npackages/opencode/src/migration/capture.ts\npackages/opencode/test/distribution/lean-candidate-workflow.test.ts\npackages/opencode/test/distribution/lean-cohort.test.ts\npackages/opencode/test/distribution/preliminary-unsigned-wsl-workflow.test.ts\npackages/opencode/test/migration/capture.test.ts' ]]
          [[ "$WSL_ACCEPTANCE_MODE" == "required" || "$WSL_ACCEPTANCE_MODE" == "owner-waived-hotfix-1.15.23" ]]
          grep -F '"packageManager": "bun@1.3.14"' package.json
          [[ "$(bun --version)" == "1.3.14" ]]

          source_sha="$SOURCE_SHA"
          candidate_tag="next-beta-${source_sha:0:12}"
          cli_version="$(bun -e 'process.stdout.write((await Bun.file("packages/opencode/package.json").json()).version)')"
          desktop_version="$(bun -e 'process.stdout.write((await Bun.file("packages/desktop/package.json").json()).version)')"
          [[ "$cli_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$desktop_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$WSL_ACCEPTANCE_MODE" == "owner-waived-hotfix-1.15.23" ]]; then
            [[ "$desktop_version" == "1.15.23" ]]
          fi
          {
            printf 'candidate_tag=%s\n' "$candidate_tag"
            printf 'cli_version=%s\n' "$cli_version"
            printf 'desktop_version=%s\n' "$desktop_version"
            printf 'wsl_runtime_version=%s\n' "$desktop_version"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: admit-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install exact dependencies
        run: bun install --frozen-lockfile --linker hoisted --os='*' --cpu='*'

      - name: Preflight exact cross-platform native dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun --eval '
            import { realpathSync } from "node:fs"
            import { dirname, resolve, sep } from "node:path"
            import { PLATFORM_TARGETS } from "./packages/opencode/script/distribution.mjs"
            const root = await Bun.file("package.json").json()
            const opencode = await Bun.file("packages/opencode/package.json").json()
            const opentui = [...new Set(PLATFORM_TARGETS.map((target) => `@opentui/core-${target.os}-${target.arch}`))].sort()
            const watcher = [...new Set(PLATFORM_TARGETS.map((target) => `@parcel/watcher-${target.os}-${target.arch}${target.os === "linux" ? `-${target.abi ?? "glibc"}` : ""}`))].sort()
            if (opentui.length !== 6 || watcher.length !== 8) throw new Error("native package target closure drift")
            const versions = {
              opentui: root.workspaces.catalog["@opentui/core"],
              watcher: opencode.dependencies["@parcel/watcher"],
            }
            if (!/^\d+\.\d+\.\d+$/.test(versions.opentui) || !/^\d+\.\d+\.\d+$/.test(versions.watcher)) throw new Error("native package version is not exact")
            const packageRoot = resolve("packages/opencode")
            const workspaceRoot = realpathSync(resolve("."))
            const approvedDependencyRoot = realpathSync(resolve(workspaceRoot, "node_modules"))
            if (approvedDependencyRoot !== resolve(workspaceRoot, "node_modules")) throw new Error("native dependency root origin drift")
            const opentuiManifestResolution = Bun.resolveSync("@opentui/core/package.json", packageRoot)
            const opentuiManifestPath = realpathSync(opentuiManifestResolution)
            if (opentuiManifestResolution !== opentuiManifestPath || !opentuiManifestPath.startsWith(`${approvedDependencyRoot}${sep}`)) throw new Error("OpenTUI base origin drift")
            const opentuiManifest = await Bun.file(opentuiManifestPath).json()
            if (opentuiManifest.name !== "@opentui/core" || opentuiManifest.version !== versions.opentui) throw new Error("OpenTUI base identity drift")
            for (const name of opentui) if (opentuiManifest.optionalDependencies[name] !== versions.opentui) throw new Error(`OpenTUI optional provenance drift: ${name}`)
            for (const name of watcher) if (opencode.devDependencies[name] !== versions.watcher) throw new Error(`Parcel direct provenance drift: ${name}`)
            const payloads = {
              "@opentui/core-linux-arm64": { file: "libopentui.so", bytes: 8313392, sha256: "33e1b1a7cceb0103a189161fe74606fc88034330201bd59049a88c86295b373a", os: "linux", arch: "arm64" },
              "@opentui/core-linux-x64": { file: "libopentui.so", bytes: 8199928, sha256: "84f757983fe83bb47f4bc31bae73f5cafefbcd5bc891cf1b0aa8163dfbe6de2c", os: "linux", arch: "x64" },
              "@opentui/core-darwin-arm64": { file: "libopentui.dylib", bytes: 1676080, sha256: "f5d966c54afd6969234b911460b8ce06085fbe287ce32a60554ff40b31c99a4f", os: "darwin", arch: "arm64" },
              "@opentui/core-darwin-x64": { file: "libopentui.dylib", bytes: 1687295, sha256: "caa637b108a6c12d8a6287578f84de97c9db38df1500351ee8b19a40f4cd2968", os: "darwin", arch: "x64" },
              "@opentui/core-win32-arm64": { file: "opentui.dll", bytes: 1662344, sha256: "20e901d69ead6c23181436592babfd000849ac15d84d592f9d9ed487d3e24eac", os: "win32", arch: "arm64" },
              "@opentui/core-win32-x64": { file: "opentui.dll", bytes: 1851784, sha256: "3ddefc1a47f5f35aea1755b86f0d6f0f127b686a294a473c08234ae0b98e08cb", os: "win32", arch: "x64" },
              "@parcel/watcher-linux-arm64-glibc": { file: "watcher.node", bytes: 457680, sha256: "a0bc8fc5f3e68e95218c2541b812dc07ba5fb8afd765b6252ab9e68ba5edb2aa", os: "linux", arch: "arm64" },
              "@parcel/watcher-linux-arm64-musl": { file: "watcher.node", bytes: 469800, sha256: "21ffdef959a00016dca15757b31a2416db3bfcad21cd2ec93286b82c72b15c1e", os: "linux", arch: "arm64" },
              "@parcel/watcher-linux-x64-glibc": { file: "watcher.node", bytes: 514960, sha256: "e58979069d4f71d2e36f7dc130d6dbc671e63666fe3943fd2ed481519cbf374c", os: "linux", arch: "x64" },
              "@parcel/watcher-linux-x64-musl": { file: "watcher.node", bytes: 511160, sha256: "689df89fa2412de37604b44fe0223af61fa322f5cb12c3528a29cb2051b7fa1e", os: "linux", arch: "x64" },
              "@parcel/watcher-darwin-arm64": { file: "watcher.node", bytes: 342608, sha256: "ea31618e251be57fdf7a8160bc2cb57d3131a430287681de2d321bbc3679e777", os: "darwin", arch: "arm64" },
              "@parcel/watcher-darwin-x64": { file: "watcher.node", bytes: 346272, sha256: "5fc72d98675a3b98dd795ce8e533c8ee2ae73b850c541469dc5c0ba2ea42a2a1", os: "darwin", arch: "x64" },
              "@parcel/watcher-win32-arm64": { file: "watcher.node", bytes: 548864, sha256: "805e3bdafc8b6f02b02955db024292652b0c92773a0918d1f78fdf2c8ff68769", os: "win32", arch: "arm64" },
              "@parcel/watcher-win32-x64": { file: "watcher.node", bytes: 518144, sha256: "a8199cf7b6c5102267a5889f80321a4cc92e631d7504c474d32a35b4d440f315", os: "win32", arch: "x64" },
            }
            const required = [...opentui, ...watcher].sort()
            if (JSON.stringify(Object.keys(payloads).sort()) !== JSON.stringify(required)) throw new Error("native payload closure drift")
            for (const [name, version] of [...opentui.map((name) => [name, versions.opentui]), ...watcher.map((name) => [name, versions.watcher])]) {
              const manifestResolution = Bun.resolveSync(`${name}/package.json`, packageRoot)
              const manifestPath = realpathSync(manifestResolution)
              if (manifestResolution !== manifestPath || !manifestPath.startsWith(`${approvedDependencyRoot}${sep}`)) throw new Error(`native package origin drift: ${name}`)
              const manifest = await Bun.file(manifestPath).json()
              if (manifest.name !== name || manifest.version !== version) throw new Error(`native package identity drift: ${name}`)
              const packageDir = realpathSync(dirname(manifestPath))
              if (!packageDir.startsWith(`${approvedDependencyRoot}${sep}`)) throw new Error(`native package directory origin drift: ${name}`)
              const entryResolution = Bun.resolveSync(name, packageRoot)
              const entry = realpathSync(entryResolution)
              if (entryResolution !== entry || !entry.startsWith(`${approvedDependencyRoot}${sep}`) || (entry !== packageDir && !entry.startsWith(`${packageDir}${sep}`))) throw new Error(`native package entry drift: ${name}`)
              const payload = payloads[name]
              const payloadResolution = resolve(packageDir, payload.file)
              const payloadPath = realpathSync(payloadResolution)
              if (payloadResolution !== payloadPath || !payloadPath.startsWith(`${approvedDependencyRoot}${sep}`) || !payloadPath.startsWith(`${packageDir}${sep}`)) throw new Error(`native payload path drift: ${name}`)
              const bytes = new Uint8Array(await Bun.file(payloadPath).arrayBuffer())
              if (payload.bytes !== bytes.length || new Bun.CryptoHasher("sha256").update(bytes).digest("hex") !== payload.sha256) throw new Error(`native payload digest drift: ${name}`)
              const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength)
              if (payload.os === "linux") {
                if (bytes.length < 20 || Buffer.from(bytes.subarray(0, 6)).toString("hex") !== "7f454c460201" || view.getUint16(18, true) !== (payload.arch === "arm64" ? 0xb7 : 0x3e)) throw new Error(`native ELF identity drift: ${name}`)
                continue
              }
              if (payload.os === "darwin") {
                if (bytes.length < 8 || view.getUint32(0, true) !== 0xfeedfacf || view.getUint32(4, true) !== (payload.arch === "arm64" ? 0x0100000c : 0x01000007)) throw new Error(`native Mach-O identity drift: ${name}`)
                continue
              }
              const peOffset = bytes.length >= 0x40 ? view.getUint32(0x3c, true) : bytes.length
              if (bytes[0] !== 0x4d || bytes[1] !== 0x5a || peOffset + 6 > bytes.length || view.getUint32(peOffset, true) !== 0x00004550 || view.getUint16(peOffset + 4, true) !== (payload.arch === "arm64" ? 0xaa64 : 0x8664)) throw new Error(`native PE identity drift: ${name}`)
            }
          '

      - name: Prove dependency install kept exact build inputs clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 -- package.json bun.lock packages/opencode/package.json)"

      - name: Build and pack the exact CLI cohort and Desktop WSL runtime
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLI_VERSION: ${{ needs.admit-source.outputs.cli_version }}
          DESKTOP_VERSION: ${{ needs.admit-source.outputs.desktop_version }}
        run: |
          set -euo pipefail
          mkdir -p out/cli out/wsl cli-dist
          (
            cd packages/opencode
            OPENCODE_VERSION="$CLI_VERSION" BHARATCODE_SOURCE_SHA="$SOURCE_SHA" \
              bun run script/build.ts --skip-install --skip-embed-web-ui --wsl-candidate
            cp -R dist/* "$GITHUB_WORKSPACE/cli-dist/"
          )
          bun --eval '
            import { lstatSync, realpathSync } from "node:fs"
            import { resolve, sep } from "node:path"
            import { PLATFORM_PACKAGE_NAMES } from "./packages/opencode/script/lean-cohort.mjs"
            for (const name of PLATFORM_PACKAGE_NAMES) {
              const pkg = await Bun.file(`cli-dist/${name}/package.json`).json()
              if (pkg.name !== name || pkg.version !== process.env.CLI_VERSION) throw new Error(`CLI package drift: ${name}`)
              if (JSON.stringify(Object.keys(pkg).sort()) !== JSON.stringify(["cpu", "files", "name", "os", "preferUnplugged", "version"])) throw new Error(`CLI package schema drift: ${name}`)
              const binary = Buffer.from(await Bun.file(`cli-dist/${name}/bin/bharatcode${name.includes("windows") ? ".exe" : ""}`).arrayBuffer())
              const header = binary.subarray(0, 4).toString("hex")
              if (name.includes("windows") ? header.slice(0, 4) !== "4d5a" || !binary.includes(Buffer.from("PE\0\0")) : name.includes("darwin") ? !["cffaedfe", "feedfacf"].includes(header) : header !== "7f454c46") throw new Error(`CLI binary header drift: ${name}`)
              const packed = Bun.spawnSync(["bun", "pm", "pack", "--destination", "../../out/cli"], { cwd: `cli-dist/${name}`, stdout: "inherit", stderr: "inherit" })
              if (packed.exitCode !== 0) process.exit(packed.exitCode)
            }
            const optionalDependencies = Object.fromEntries(PLATFORM_PACKAGE_NAMES.map((name) => [name, process.env.CLI_VERSION]))
            const metaRoot = resolve("cli-dist/bharatcode")
            await Bun.$`mkdir -p ${metaRoot}/bin ${metaRoot}/script`
            if (realpathSync(metaRoot) !== metaRoot || lstatSync(metaRoot).isSymbolicLink()) throw new Error("CLI meta package root drift")
            const sources = [
              { source: resolve("packages/opencode/bin/bharatcode.mjs"), target: resolve(metaRoot, "bin/bharatcode.mjs"), packagePath: "package/bin/bharatcode.mjs" },
              { source: resolve("packages/opencode/script/distribution.mjs"), target: resolve(metaRoot, "script/distribution.mjs"), packagePath: "package/script/distribution.mjs" },
            ]
            const digest = (bytes) => new Bun.CryptoHasher("sha256").update(bytes).digest("hex")
            for (const binding of sources) {
              if (realpathSync(binding.source) !== binding.source || lstatSync(binding.source).isSymbolicLink()) throw new Error("CLI meta source path drift")
              if (!binding.target.startsWith(`${metaRoot}${sep}`)) throw new Error("CLI meta target path drift")
              const sourceBytes = new Uint8Array(await Bun.file(binding.source).arrayBuffer())
              await Bun.write(binding.target, sourceBytes)
              if (realpathSync(binding.target) !== binding.target || lstatSync(binding.target).isSymbolicLink()) throw new Error("CLI meta staged path drift")
              const targetBytes = new Uint8Array(await Bun.file(binding.target).arrayBuffer())
              if (sourceBytes.length !== targetBytes.length || digest(sourceBytes) !== digest(targetBytes)) throw new Error("CLI meta staged bytes drift")
            }
            const metaManifest = { name: "bharatcode", version: process.env.CLI_VERSION, type: "module", bin: { bharatcode: "bin/bharatcode.mjs" }, files: ["bin", "script/distribution.mjs"], optionalDependencies, os: ["darwin", "linux", "win32"], cpu: ["arm64", "x64"] }
            const metaManifestPath = resolve(metaRoot, "package.json")
            if (!metaManifestPath.startsWith(`${metaRoot}${sep}`)) throw new Error("CLI meta manifest path drift")
            await Bun.write(metaManifestPath, JSON.stringify(metaManifest, null, 2))
            if (realpathSync(metaManifestPath) !== metaManifestPath || lstatSync(metaManifestPath).isSymbolicLink()) throw new Error("CLI meta manifest path drift")
            const writtenManifest = await Bun.file(metaManifestPath).json()
            if (JSON.stringify(Object.keys(writtenManifest).sort()) !== JSON.stringify(["bin", "cpu", "files", "name", "optionalDependencies", "os", "type", "version"])) throw new Error("CLI meta package schema drift")
            if (JSON.stringify(writtenManifest) !== JSON.stringify(metaManifest)) throw new Error("CLI meta package content drift")
            const packed = Bun.spawnSync(["bun", "pm", "pack", "--destination", "../../out/cli"], { cwd: "cli-dist/bharatcode", stdout: "inherit", stderr: "inherit" })
            if (packed.exitCode !== 0) process.exit(packed.exitCode)
            const metaTarball = resolve("out/cli", `bharatcode-${process.env.CLI_VERSION}.tgz`)
            const listed = Bun.spawnSync(["tar", "-tzf", metaTarball], { stdout: "pipe", stderr: "inherit" })
            if (listed.exitCode !== 0) process.exit(listed.exitCode)
            const entries = listed.stdout.toString().trim().split("\n").filter(Boolean).sort()
            const expectedEntries = ["package/bin/bharatcode.mjs", "package/package.json", "package/script/distribution.mjs"]
            if (JSON.stringify(entries) !== JSON.stringify(expectedEntries)) throw new Error("CLI meta tarball closure drift")
            for (const binding of sources) {
              const extracted = Bun.spawnSync(["tar", "-xOf", metaTarball, binding.packagePath], { stdout: "pipe", stderr: "inherit" })
              if (extracted.exitCode !== 0) process.exit(extracted.exitCode)
              const sourceBytes = new Uint8Array(await Bun.file(binding.source).arrayBuffer())
              if (sourceBytes.length !== extracted.stdout.length || digest(sourceBytes) !== digest(extracted.stdout)) throw new Error("CLI meta tarball bytes drift")
            }
            const extractedManifest = Bun.spawnSync(["tar", "-xOf", metaTarball, "package/package.json"], { stdout: "pipe", stderr: "inherit" })
            if (extractedManifest.exitCode !== 0) process.exit(extractedManifest.exitCode)
            const manifestBytes = new Uint8Array(await Bun.file(metaManifestPath).arrayBuffer())
            if (manifestBytes.length !== extractedManifest.stdout.length || digest(manifestBytes) !== digest(extractedManifest.stdout)) throw new Error("CLI meta tarball manifest drift")
          '
          rm -rf packages/opencode/dist
          (
            cd packages/opencode
            OPENCODE_VERSION="$DESKTOP_VERSION" BHARATCODE_SOURCE_SHA="$SOURCE_SHA" \
              bun run script/build.ts --single --skip-install --skip-embed-web-ui --wsl-candidate
          )
          runtime="packages/opencode/dist/bharatcode-linux-x64/bin/bharatcode"
          bytes="$(stat -c %s "$runtime")"
          sha256="$(sha256sum "$runtime" | cut -d ' ' -f 1)"
          cp "$runtime" out/wsl/bharatcode-runtime-linux-x64-glibc
          RUNTIME_BYTES="$bytes" RUNTIME_SHA256="$sha256" bun --eval '
            const value = { schema: 1, source_sha: process.env.SOURCE_SHA, version: process.env.DESKTOP_VERSION, arch: "x64", filename: "bharatcode-runtime-linux-x64-glibc", bytes: Number(process.env.RUNTIME_BYTES), sha256: process.env.RUNTIME_SHA256 }
            await Bun.write("out/wsl/manifest.json", `${JSON.stringify(value)}\n`)
          '
          test "$(find out/cli -maxdepth 1 -name '*.tgz' | wc -l)" -eq 13
          for package in out/cli/*.tgz; do
            tar -tzf "$package" | sort -u | grep -Fx package/package.json
          done

      - name: Attest CLI package subjects
        id: attest_cli
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: out/cli/*.tgz
          show-summary: false

      - name: Attest WSL runtime inputs
        id: attest_wsl_runtime
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            out/wsl/bharatcode-runtime-linux-x64-glibc
            out/wsl/manifest.json
          show-summary: false

      - name: Preserve one unique provenance bundle per CLI subject
        shell: bash
        env:
          CLI_BUNDLE: ${{ steps.attest_cli.outputs.bundle-path }}
          WSL_BUNDLE: ${{ steps.attest_wsl_runtime.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for subject in out/cli/*.tgz; do
            cp "$CLI_BUNDLE" "$subject.intoto.jsonl"
          done
          cp "$WSL_BUNDLE" out/wsl/runtime-inputs.intoto.jsonl

      - name: Upload run-attempt-scoped CLI and WSL inputs
        id: upload_cli
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/cli
            out/wsl
          if-no-files-found: error
          overwrite: false

      - name: Bind uploaded CLI archive digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_cli.outputs.artifact-digest }}
        run: '[[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]'

  package-windows:
    needs: [admit-source, build-cli]
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BHARATCODE_ALLOW_UNSIGNED_WINDOWS: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      INTEGRATED_HEAD: ${{ inputs.source_sha }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Require Windows native build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "Windows native build tools are unavailable" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) { throw "Windows native build tools are unavailable" }

      - name: Download same-run WSL runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cp2-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input
          digest-mismatch: error

      - name: Install exact dependencies and stage WSL runtime
        shell: pwsh
        run: |
          bun install --frozen-lockfile --linker hoisted
          $runtime = (Resolve-Path candidate-input/wsl/bharatcode-runtime-linux-x64-glibc).Path
          $manifest = (Resolve-Path candidate-input/wsl/manifest.json).Path
          Set-ItemProperty -LiteralPath $runtime -Name IsReadOnly -Value $true
          Set-ItemProperty -LiteralPath $manifest -Name IsReadOnly -Value $true
          $env:BHARATCODE_WSL_RUNTIME = $runtime
          $env:BHARATCODE_WSL_RUNTIME_MANIFEST = $manifest
          $env:BHARATCODE_WSL_RUNTIME_ARCH = "x64"
          bun run --cwd packages/desktop stage:wsl-runtime

      - name: Build unsigned Windows installer
        working-directory: packages/desktop
        shell: pwsh
        run: |
          bun run typecheck
          bun run build
          bunx electron-builder --win nsis --x64 --config electron-builder.config.ts --publish never
          $files = @(Get-ChildItem dist -File -Filter *.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one Windows installer" }
          Move-Item $files[0].FullName "$env:GITHUB_WORKSPACE/bharatcode-desktop-next-beta-win-x64.exe"
          Copy-Item resources/wsl-runtime/manifest.json "$env:GITHUB_WORKSPACE/bharatcode-wsl-runtime-manifest.json"

      - name: Verify unsigned Windows policy and package version
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature bharatcode-desktop-next-beta-win-x64.exe
          if ($env:BHARATCODE_ALLOW_UNSIGNED_WINDOWS -cne "1" -or $env:CSC_IDENTITY_AUTO_DISCOVERY -cne "false") { throw "Unsigned Windows policy is not explicit" }
          if ($signature.Status -ne "NotSigned" -or $null -ne $signature.SignerCertificate -or $null -ne $signature.TimeStamperCertificate) { throw "Windows package unexpectedly contains a signature" }
          $version = (Get-Item bharatcode-desktop-next-beta-win-x64.exe).VersionInfo.ProductVersion
          if ([version]$version -ne [version]'${{ needs.admit-source.outputs.desktop_version }}') { throw "Windows package version drift" }

      - name: Attest Windows installer
        id: attest_windows
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-desktop-next-beta-win-x64.exe
          show-summary: false

      - name: Stage Windows provenance
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.attest_windows.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE_PATH bharatcode-desktop-next-beta-win-x64.exe.intoto.jsonl

      - name: Upload run-attempt-scoped Windows package
        id: upload_windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-desktop-next-beta-win-x64.exe
            bharatcode-desktop-next-beta-win-x64.exe.intoto.jsonl
            bharatcode-wsl-runtime-manifest.json
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded Windows archive digest
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_windows.outputs.artifact-digest }}
        run: if ($env:ARTIFACT_DIGEST -notmatch '^(sha256:)?[0-9a-f]{64}$') { throw "Invalid artifact digest" }

  package-macos:
    needs: admit-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      EXPECTED_APPLE_DEVELOPER_ID_SUBJECT: ${{ vars.BHARATCODE_EXPECTED_APPLE_DEVELOPER_ID_SUBJECT }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Materialize protected Apple API key
        shell: bash
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!key:-}" ]]
          done
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          APPLE_KEY_PATH="$key_path" bun --eval '
            const raw = process.env.APPLE_API_KEY.trim()
            const decoded = Buffer.from(raw, "base64")
            const value = decoded.includes(Buffer.from("BEGIN PRIVATE KEY")) ? decoded : Buffer.from(raw)
            await Bun.write(process.env.APPLE_KEY_PATH, value.toString().endsWith("\n") ? value : Buffer.concat([value, Buffer.from("\n")]))
          '
          chmod 600 "$key_path"
          printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build signed, notarized, stapled macOS package
        shell: bash
        run: |
          set -euo pipefail
          bun --eval '
            const value = process.env.EXPECTED_APPLE_DEVELOPER_ID_SUBJECT
            const team = process.env.APPLE_TEAM_ID
            if (typeof value !== "string" || value.trim() !== value || value.includes("\n") || value.includes("\r") || !/^[A-Za-z0-9][A-Za-z0-9 .-]{0,127}$/.test(value)) throw new Error("protected Apple identity subject is missing or malformed")
            if (typeof team !== "string" || !/^[A-Z0-9]{10}$/.test(team)) throw new Error("protected Apple team identity is missing or malformed")
          '
          bun install --frozen-lockfile --linker hoisted
          bun run --cwd packages/desktop typecheck
          bun run --cwd packages/desktop build
          (cd packages/desktop && bunx electron-builder --mac zip --${{ matrix.arch }} --config electron-builder.config.ts --publish never)
          app_path="$(find packages/desktop/dist -maxdepth 3 -type d -name '*.app' -print -quit)"
          [[ -n "$app_path" ]]
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"
          # Run 29712784688 jobs 88259572335 and 88259572313 proved the former repository variable was absent.
          expected_authority="Developer ID Application: ${EXPECTED_APPLE_DEVELOPER_ID_SUBJECT} (${APPLE_TEAM_ID})"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          [[ "$(grep -c '^Authority=' <<< "$signature")" -eq 3 ]]
          grep -Fx "Authority=$expected_authority" <<< "$signature"
          grep -Fx "Authority=Developer ID Certification Authority" <<< "$signature"
          grep -Fx "Authority=Apple Root CA" <<< "$signature"
          [[ "$(grep -c '^TeamIdentifier=' <<< "$signature")" -eq 1 ]]
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" == "${{ needs.admit-source.outputs.desktop_version }}" ]]
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          expected_arch="${{ matrix.arch }}"
          [[ "$expected_arch" != "x64" ]] || expected_arch="x86_64"
          [[ "$(lipo -archs "$app_path/Contents/MacOS/$executable")" == "$expected_arch" ]]
          zip_path="$(find packages/desktop/dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          [[ -n "$zip_path" ]]
          cp "$zip_path" "bharatcode-desktop-next-beta-mac-${{ matrix.arch }}.zip"

      - name: Attest macOS package
        id: attest_macos
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-desktop-next-beta-mac-${{ matrix.arch }}.zip
          show-summary: false

      - name: Stage macOS provenance
        env:
          BUNDLE_PATH: ${{ steps.attest_macos.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "bharatcode-desktop-next-beta-mac-${{ matrix.arch }}.zip.intoto.jsonl"

      - name: Upload run-attempt-scoped macOS package
        id: upload_macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-desktop-next-beta-mac-${{ matrix.arch }}.zip
            bharatcode-desktop-next-beta-mac-${{ matrix.arch }}.zip.intoto.jsonl
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded macOS archive digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_macos.outputs.artifact-digest }}
        run: '[[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]'

  package-linux:
    needs: admit-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --linker hoisted
          bun run --cwd packages/desktop typecheck
          bun run --cwd packages/desktop build
          (cd packages/desktop && bunx electron-builder --linux AppImage deb --x64 --config electron-builder.config.ts --publish never)
          appimage="$(find packages/desktop/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find packages/desktop/dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          [[ -n "$appimage" && -n "$deb" ]]
          expected_package="$(bun --eval 'import { packageNameForChannel } from "./packages/desktop/src/main/branding.ts"; process.stdout.write(packageNameForChannel("beta"))')"
          [[ "$(dpkg-deb --field "$deb" Package)" == "$expected_package" ]]
          [[ "$(dpkg-deb --field "$deb" Architecture)" == "amd64" ]]
          [[ "$(dpkg-deb --field "$deb" Version)" == "${{ needs.admit-source.outputs.desktop_version }}" ]]
          sudo apt-get install -y "./$deb"
          dpkg-query -W -f='${Architecture} ${Version}\n' "$expected_package" | grep -F "amd64 ${{ needs.admit-source.outputs.desktop_version }}"
          chmod +x "$appimage"
          file "$appimage" | grep -F "x86-64"
          "$appimage" --appimage-extract > /dev/null
          # Run 29712784688 job 88259572297 proved AppRun is a wrapper, not the packaged application ELF.
          # Canonical false-EULA render: app-builder-bin v5.0.0-alpha.12 source 580c34f2e19347061bc2243fa6ab6e57e9bbd2a6, ExecutableName bharatcode-beta.
          bash -n squashfs-root/AppRun
          [[ "$(stat -c %s squashfs-root/AppRun)" -eq 2356 ]]
          [[ "$(sha256sum squashfs-root/AppRun | cut -d ' ' -f 1)" == "897b7e36db7be71f3bf8a427cd24ece7d7fdd6763ecf79f9878e6e0a3f96b9d6" ]]
          appimage_target="squashfs-root/$expected_package"
          [[ -f "$appimage_target" && -x "$appimage_target" && ! -L "$appimage_target" ]]
          file -L -b "$appimage_target" | grep -E '^ELF 64-bit LSB (pie )?executable, x86-64,'
          cp "$appimage" bharatcode-desktop-next-beta-linux-x64.AppImage
          cp "$deb" bharatcode-desktop-next-beta-linux-x64.deb

      - name: Attest Linux AppImage
        id: attest_appimage
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-desktop-next-beta-linux-x64.AppImage
          show-summary: false

      - name: Attest Linux Debian package
        id: attest_deb
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-desktop-next-beta-linux-x64.deb
          show-summary: false

      - name: Stage Linux provenance
        env:
          APPIMAGE_BUNDLE: ${{ steps.attest_appimage.outputs.bundle-path }}
          DEB_BUNDLE: ${{ steps.attest_deb.outputs.bundle-path }}
        run: |
          cp "$APPIMAGE_BUNDLE" bharatcode-desktop-next-beta-linux-x64.AppImage.intoto.jsonl
          cp "$DEB_BUNDLE" bharatcode-desktop-next-beta-linux-x64.deb.intoto.jsonl

      - name: Upload run-attempt-scoped Linux packages
        id: upload_linux
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-desktop-next-beta-linux-x64.AppImage
            bharatcode-desktop-next-beta-linux-x64.AppImage.intoto.jsonl
            bharatcode-desktop-next-beta-linux-x64.deb
            bharatcode-desktop-next-beta-linux-x64.deb.intoto.jsonl
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded Linux archive digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_linux.outputs.artifact-digest }}
        run: '[[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]'

  accept-cli-native:
    needs: [admit-source, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package: bharatcode-linux-x64
          - runner: windows-2025
            package: bharatcode-windows-x64
          - runner: macos-14
            package: bharatcode-darwin-arm64
          - runner: macos-15-intel
            package: bharatcode-darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download same-run CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cp2-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input
          digest-mismatch: error

      - name: Install meta and platform tarballs globally, then execute npx
        shell: bash
        env:
          CLI_VERSION: ${{ needs.admit-source.outputs.cli_version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/bharatcode-cli-native"
          meta="$(find candidate-input -type f -name "bharatcode-${CLI_VERSION}.tgz" -print -quit)"
          native="$(find candidate-input -type f -name "${{ matrix.package }}-${CLI_VERSION}.tgz" -print -quit)"
          [[ -n "$meta" && -n "$native" ]]
          npm install --global --prefix "$prefix" --ignore-scripts --offline "$native" "$meta"
          fail_layout() {
            printf '%s\n' "native CLI acceptance layout validation failed" >&2
            exit 1
          }
          # Run 29722640762 job 88289107783 proved a raw drive-letter PATH redirects npm's Git Bash shim to A:\_temp.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command -v cygpath >/dev/null || fail_layout
            prefix_path="$(cygpath -u "$prefix")"
            [[ "$prefix_path" == /* && "$prefix_path" != *:* ]] || fail_layout
            package_root="$prefix_path/node_modules/bharatcode"
            native_root="$prefix_path/node_modules/${{ matrix.package }}"
            shim_root="$prefix_path"
            windows_suffix=".exe"
            layout="windows-global"
          else
            prefix_path="$prefix"
            package_root="$prefix/lib/node_modules/bharatcode"
            native_root="$prefix/lib/node_modules/${{ matrix.package }}"
            shim_root="$prefix/bin"
            windows_suffix=""
            layout="unix-global"
          fi
          [[ -f "$package_root/bin/bharatcode.mjs" ]] || fail_layout
          [[ -f "$package_root/script/distribution.mjs" ]] || fail_layout
          [[ -f "$native_root/bin/bharatcode${windows_suffix}" ]] || fail_layout
          [[ -f "$shim_root/bharatcode" ]] || fail_layout
          [[ "$RUNNER_OS" != "Windows" || -f "$shim_root/bharatcode.cmd" ]] || fail_layout
          [[ "$RUNNER_OS" != "Windows" || -f "$shim_root/bharatcode.ps1" ]] || fail_layout
          [[ "$RUNNER_OS" != "Windows" ]] || grep -F 'node_modules/bharatcode/bin/bharatcode.mjs' "$shim_root/bharatcode" >/dev/null || fail_layout
          export PATH="$shim_root:$PATH"
          [[ "$(command -v bharatcode)" == "$shim_root/bharatcode" ]] || fail_layout
          export npm_config_prefix="$prefix"
          export npm_config_offline=true
          npx_cache="$prefix_path/.npx-cache"
          [[ ! -e "$npx_cache" ]] || fail_layout
          mkdir "$npx_cache"
          export npm_config_cache="$npx_cache"
          printf '%s\n' "native CLI layout verified: $layout"
          [[ "$(bharatcode --version)" == "$CLI_VERSION" ]]
          npx --no-install bharatcode --version | grep -Fx "$CLI_VERSION"

  accept-wsl:
    if: inputs.wsl_acceptance_mode == 'required'
    needs: [admit-source, build-cli, package-windows]
    runs-on: [self-hosted, windows, x64, wsl2, "bharatcode-acceptance-${{ github.run_id }}-${{ github.run_attempt }}"]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download same-run Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cp2-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input
          digest-mismatch: error

      - name: Run accepted real Windows WSL2 scenarios 9 and 10
        shell: pwsh
        run: |
          $exe = (Resolve-Path candidate-input/bharatcode-desktop-next-beta-win-x64.exe)
          $manifest = (Resolve-Path candidate-input/bharatcode-wsl-runtime-manifest.json)
          bun packages/desktop/scripts/wsl-windows-acceptance.mjs `
            --desktop-exe $exe `
            --runtime-manifest $manifest `
            --distribution '${{ vars.BHARATCODE_WSL_DISTRIBUTION }}' `
            --invalid-distribution '${{ vars.BHARATCODE_WSL_INVALID_DISTRIBUTION }}' `
            --missing-prerequisite-distribution '${{ vars.BHARATCODE_WSL_MISSING_PREREQUISITE_DISTRIBUTION }}' `
            --windows-project '${{ vars.BHARATCODE_WSL_WINDOWS_PROJECT }}' `
            --source-sha '${{ inputs.source_sha }}' `
            --acceptance-dir "$env:RUNNER_TEMP\bharatcode-wsl-acceptance"
          Copy-Item "$env:RUNNER_TEMP\bharatcode-wsl-acceptance\scenarios-9-10.json" bharatcode-wsl-scenarios-9-10.json

      - name: Validate exact WSL receipt binding
        shell: bash
        run: |
          desktop_sha256="$(sha256sum candidate-input/bharatcode-desktop-next-beta-win-x64.exe | cut -d ' ' -f 1)"
          runtime_manifest_sha256="$(sha256sum candidate-input/bharatcode-wsl-runtime-manifest.json | cut -d ' ' -f 1)"
          DESKTOP_SHA256="$desktop_sha256" RUNTIME_MANIFEST_SHA256="$runtime_manifest_sha256" bun --eval '
            import { validateLeanWslReceipt } from "./packages/opencode/script/lean-cohort.mjs"
            validateLeanWslReceipt(await Bun.file("bharatcode-wsl-scenarios-9-10.json").json(), { source_sha: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, desktop_sha256: process.env.DESKTOP_SHA256, runtime_manifest_sha256: process.env.RUNTIME_MANIFEST_SHA256 })
          '

      - name: Attest WSL acceptance receipt
        id: attest_wsl
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-wsl-scenarios-9-10.json
          show-summary: false

      - name: Stage WSL provenance
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.attest_wsl.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE_PATH bharatcode-wsl-scenarios-9-10.json.intoto.jsonl

      - name: Upload run-attempt-scoped WSL receipt
        id: upload_wsl
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-wsl-scenarios-9-10.json
            bharatcode-wsl-scenarios-9-10.json.intoto.jsonl
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded WSL archive digest
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_wsl.outputs.artifact-digest }}
        run: if ($env:ARTIFACT_DIGEST -notmatch '^(sha256:)?[0-9a-f]{64}$') { throw "Invalid artifact digest" }

  record-wsl-waiver:
    if: inputs.wsl_acceptance_mode == 'owner-waived-hotfix-1.15.23'
    needs: [admit-source, build-cli, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download same-run Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cp2-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input
          digest-mismatch: error

      - name: Record exact owner-authorized WSL automation waiver
        env:
          ACCEPTED_APPLICATION_SOURCE_SHA: 80c962f4148db531c35abcf4922059d2101c9bcd
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          bun --eval '
            import { createHash } from "node:crypto"
            import { validateLeanWslWaiver, canonicalLeanJson } from "./packages/opencode/script/lean-cohort.mjs"
            const digest = async (path) => createHash("sha256").update(new Uint8Array(await Bun.file(path).arrayBuffer())).digest("hex")
            const desktopSha256 = await digest("candidate-input/bharatcode-desktop-next-beta-win-x64.exe")
            const runtimeManifestSha256 = await digest("candidate-input/bharatcode-wsl-runtime-manifest.json")
            const receipt = {
              schema: "bharatcode-wsl-acceptance-waiver-v1",
              result: "OWNER_WAIVED",
              reason: "FORMAL_WINDOWS_WSL2_VM_ACCEPTANCE_NOT_RUN_BY_OWNER_DECISION",
              manual_acceptance: "INSTALLED_WINDOWS_STARTUP_SIGNIN_PROJECT_MODELS_SESSION_RESTORE_USER_CONFIRMED",
              accepted_application_source_sha: process.env.ACCEPTED_APPLICATION_SOURCE_SHA,
              source_sha: process.env.SOURCE_SHA,
              desktop_sha256: desktopSha256,
              runtime_manifest_sha256: runtimeManifestSha256,
              github: { actor: process.env.GITHUB_ACTOR_VALUE, run_id: Number(process.env.GITHUB_RUN_ID), run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT) },
              completed_at: new Date().toISOString(),
            }
            validateLeanWslWaiver(receipt, { source_sha: process.env.SOURCE_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, desktop_sha256: desktopSha256, runtime_manifest_sha256: runtimeManifestSha256 })
            await Bun.write("bharatcode-wsl-acceptance-waiver.json", canonicalLeanJson(receipt))
          '

      - name: Attest owner-authorized WSL waiver receipt
        id: attest_wsl_waiver
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-wsl-acceptance-waiver.json
          show-summary: false

      - name: Stage WSL waiver provenance
        env:
          BUNDLE_PATH: ${{ steps.attest_wsl_waiver.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" bharatcode-wsl-acceptance-waiver.json.intoto.jsonl

      - name: Upload run-attempt-scoped WSL waiver receipt
        id: upload_wsl_waiver
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-wsl-acceptance-waiver.json
            bharatcode-wsl-acceptance-waiver.json.intoto.jsonl
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded WSL waiver archive digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_wsl_waiver.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]

  upgrade-rollback-windows-x64:
    needs: [admit-source, package-windows]
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Pin binary checkout semantics
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download same-run Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cp2-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input
          digest-mismatch: error

      - name: Run real packaged upgrade and rollback acceptance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun packages/desktop/scripts/lean-upgrade-acceptance.mjs `
            --fixture packages/desktop/test/fixtures/current-beta-windows-x64.json `
            --candidate candidate-input/bharatcode-desktop-next-beta-win-x64.exe `
            --source-sha '${{ inputs.source_sha }}' `
            --acceptance-dir "$env:RUNNER_TEMP\bharatcode-upgrade-acceptance"
          Copy-Item "$env:RUNNER_TEMP\bharatcode-upgrade-acceptance\upgrade-rollback-windows-x64.json" bharatcode-upgrade-rollback-windows-x64.json

      - name: Validate packaged upgrade receipt before attestation
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          bun --eval '
            import { createHash } from "node:crypto"
            import { stat } from "node:fs/promises"
            import { basename } from "node:path"
            import { parseCurrentBetaFixtureBytes, parseLeanUpgradeReceiptBytes } from "./packages/desktop/scripts/lean-upgrade-receipt.mjs"
            const fixturePath = "packages/desktop/test/fixtures/current-beta-windows-x64.json"
            const candidatePath = "candidate-input/bharatcode-desktop-next-beta-win-x64.exe"
            const currentBeta = parseCurrentBetaFixtureBytes(new Uint8Array(await Bun.file(fixturePath).arrayBuffer()))
            const candidateBytes = new Uint8Array(await Bun.file(candidatePath).arrayBuffer())
            const candidate = { key: "desktop-windows-x64", filename: basename(candidatePath), bytes: (await stat(candidatePath)).size, sha256: createHash("sha256").update(candidateBytes).digest("hex") }
            parseLeanUpgradeReceiptBytes(new Uint8Array(await Bun.file("bharatcode-upgrade-rollback-windows-x64.json").arrayBuffer()), { source_sha: process.env.SOURCE_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, current_beta: currentBeta, candidate })
          '

      - name: Attest upgrade and rollback receipt
        id: attest_upgrade
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-upgrade-rollback-windows-x64.json
          show-summary: false

      - name: Stage upgrade provenance
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.attest_upgrade.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE_PATH bharatcode-upgrade-rollback-windows-x64.json.intoto.jsonl

      - name: Upload run-attempt-scoped upgrade receipt
        id: upload_upgrade
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-upgrade-rollback-windows-x64.json
            bharatcode-upgrade-rollback-windows-x64.json.intoto.jsonl
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded upgrade archive digest
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_upgrade.outputs.artifact-digest }}
        run: if ($env:ARTIFACT_DIGEST -notmatch '^(sha256:)?[0-9a-f]{64}$') { throw "Invalid artifact digest" }

  assemble-cohort:
    if: >-
      ${{
        always() &&
        needs.admit-source.result == 'success' &&
        needs.build-cli.result == 'success' &&
        needs.package-windows.result == 'success' &&
        needs.package-macos.result == 'success' &&
        needs.package-linux.result == 'success' &&
        needs.accept-cli-native.result == 'success' &&
        needs.upgrade-rollback-windows-x64.result == 'success' &&
        ((inputs.wsl_acceptance_mode == 'required' && needs.accept-wsl.result == 'success' && needs.record-wsl-waiver.result == 'skipped') ||
         (inputs.wsl_acceptance_mode == 'owner-waived-hotfix-1.15.23' && needs.accept-wsl.result == 'skipped' && needs.record-wsl-waiver.result == 'success'))
      }}
    needs:
      - admit-source
      - build-cli
      - package-windows
      - package-macos
      - package-linux
      - accept-cli-native
      - accept-wsl
      - record-wsl-waiver
      - upgrade-rollback-windows-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download every same-run producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cp2-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: cohort-input
          merge-multiple: true
          digest-mismatch: error

      - name: Bind GitHub workflow-run and artifact API metadata
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          bun --eval '
            const api = "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            const headers = { Accept: "application/vnd.github+json", "User-Agent": "bharatcode-candidate-verifier", "X-GitHub-Api-Version": "2022-11-28" }
            const run = await fetch(api, { headers }).then((response) => response.ok ? response.json() : Promise.reject(new Error(`run API ${response.status}`)))
            if (String(run.id) !== process.env.GITHUB_RUN_ID || String(run.run_attempt) !== process.env.GITHUB_RUN_ATTEMPT || run.head_sha !== process.env.EXPECTED_SOURCE_SHA || run.event !== "workflow_dispatch" || run.path !== process.env.WORKFLOW_PATH) throw new Error("Workflow-run API identity drift")
            const page = await fetch(`${api}/artifacts?per_page=100`, { headers }).then((response) => response.ok ? response.json() : Promise.reject(new Error(`artifact API ${response.status}`)))
            const expected = ["cp2-cli", "cp2-windows", "cp2-macos-arm64", "cp2-macos-x64", "cp2-linux", "cp2-wsl", "cp2-upgrade"].map((name) => `${name}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`).sort()
            const actual = page.artifacts.filter((item) => expected.includes(item.name)).map((item) => {
              if (item.expired || item.workflow_run?.id !== run.id || item.workflow_run?.head_sha !== process.env.EXPECTED_SOURCE_SHA || !Number.isSafeInteger(item.id)) throw new Error("Artifact API identity drift")
              return item.name
            }).sort()
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("Artifact API set is incomplete or duplicated")
          '

      - name: Verify every artifact attestation against exact source and signer
        env:
          CLI_VERSION: ${{ needs.admit-source.outputs.cli_version }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WSL_ACCEPTANCE_MODE: ${{ inputs.wsl_acceptance_mode }}
        run: |
          set -euo pipefail
          cohort_subjects=(
            "bharatcode-${CLI_VERSION}.tgz"
            "bharatcode-darwin-arm64-${CLI_VERSION}.tgz"
            "bharatcode-darwin-x64-${CLI_VERSION}.tgz"
            "bharatcode-darwin-x64-baseline-${CLI_VERSION}.tgz"
            "bharatcode-linux-arm64-${CLI_VERSION}.tgz"
            "bharatcode-linux-arm64-musl-${CLI_VERSION}.tgz"
            "bharatcode-linux-x64-${CLI_VERSION}.tgz"
            "bharatcode-linux-x64-baseline-${CLI_VERSION}.tgz"
            "bharatcode-linux-x64-baseline-musl-${CLI_VERSION}.tgz"
            "bharatcode-linux-x64-musl-${CLI_VERSION}.tgz"
            "bharatcode-windows-arm64-${CLI_VERSION}.tgz"
            "bharatcode-windows-x64-${CLI_VERSION}.tgz"
            "bharatcode-windows-x64-baseline-${CLI_VERSION}.tgz"
            "bharatcode-desktop-next-beta-linux-x64.AppImage"
            "bharatcode-desktop-next-beta-linux-x64.deb"
            "bharatcode-desktop-next-beta-mac-arm64.zip"
            "bharatcode-desktop-next-beta-mac-x64.zip"
            "bharatcode-desktop-next-beta-win-x64.exe"
            "bharatcode-upgrade-rollback-windows-x64.json"
          )
          if [[ "$WSL_ACCEPTANCE_MODE" == "required" ]]; then
            cohort_subjects+=("bharatcode-wsl-scenarios-9-10.json")
          else
            cohort_subjects+=("bharatcode-wsl-acceptance-waiver.json")
          fi
          mapfile -d '' actual_subjects < <(
            find cohort-input -type f \
              ! -name '*.intoto.jsonl' \
              ! -name 'manifest.json' \
              ! -name 'bharatcode-runtime-linux-x64-glibc' \
              ! -name 'bharatcode-wsl-runtime-manifest.json' \
              -print0
          )
          [[ "${#actual_subjects[@]}" -eq "${#cohort_subjects[@]}" ]]
          for filename in "${cohort_subjects[@]}"; do
            mapfile -d '' matches < <(find cohort-input -type f -name "$filename" -print0)
            [[ "${#matches[@]}" -eq 1 ]]
            subject="${matches[0]}"
            bundle="$subject.intoto.jsonl"
            [[ -f "$bundle" ]]
            gh attestation verify "$subject" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/$WORKFLOW_PATH" \
              --source-digest "$SOURCE_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > /dev/null
          done

      - name: Rehash, close, and validate final manifest
        env:
          CLI_VERSION: ${{ needs.admit-source.outputs.cli_version }}
          DESKTOP_VERSION: ${{ needs.admit-source.outputs.desktop_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WSL_ACCEPTANCE_MODE: ${{ inputs.wsl_acceptance_mode }}
        run: |
          bun --eval '
            import { createHash } from "node:crypto"
            import { stat } from "node:fs/promises"
            import { basename } from "node:path"
            import { Glob } from "bun"
            import { parseCurrentBetaFixtureBytes, parseLeanUpgradeReceiptBytes } from "./packages/desktop/scripts/lean-upgrade-receipt.mjs"
            import { PLATFORM_PACKAGE_NAMES, REQUIRED_COHORT_KEYS, canonicalLeanJson, validateLeanCohort, validateLeanWslReceipt, validateLeanWslWaiver } from "./packages/opencode/script/lean-cohort.mjs"
            const expectedKeys = ["cli-bharatcode", "cli-bharatcode-darwin-arm64", "cli-bharatcode-darwin-x64", "cli-bharatcode-darwin-x64-baseline", "cli-bharatcode-linux-arm64", "cli-bharatcode-linux-arm64-musl", "cli-bharatcode-linux-x64", "cli-bharatcode-linux-x64-baseline", "cli-bharatcode-linux-x64-baseline-musl", "cli-bharatcode-linux-x64-musl", "cli-bharatcode-windows-arm64", "cli-bharatcode-windows-x64", "cli-bharatcode-windows-x64-baseline", "desktop-linux-x64-appimage", "desktop-linux-x64-deb", "desktop-macos-arm64", "desktop-macos-x64", "desktop-windows-x64", "upgrade-rollback-windows-x64", "wsl-gate"]
            if (JSON.stringify(expectedKeys) !== JSON.stringify(REQUIRED_COHORT_KEYS)) throw new Error("Workflow cohort key contract drift")
            const paths = await Array.fromAsync(new Glob("**/*").scan({ cwd: "cohort-input", absolute: true, onlyFiles: true }))
            const one = (name) => {
              const matches = paths.filter((path) => basename(path) === name)
              if (matches.length !== 1) throw new Error(`Expected exactly one ${name}`)
              return matches[0]
            }
            const digest = async (path) => createHash("sha256").update(new Uint8Array(await Bun.file(path).arrayBuffer())).digest("hex")
            const completed_at = new Date().toISOString()
            const artifact = async (key, platform, arch, signing, filename) => {
              const path = one(filename)
              const bundle = one(`${filename}.intoto.jsonl`)
              const subjectSha256 = await digest(path)
              return { key, platform, arch, filename, bytes: (await stat(path)).size, sha256: subjectSha256, artifact_attestation: { filename: basename(bundle), bytes: (await stat(bundle)).size, sha256: await digest(bundle), subject_sha256: subjectSha256, predicate_type: "https://slsa.dev/provenance/v1" }, signing, completed_at }
            }
            const cli = await Promise.all(["bharatcode", ...PLATFORM_PACKAGE_NAMES].map(async (name) => artifact(`cli-${name}`, name === "bharatcode" ? "npm" : name.includes("darwin") ? "macos" : name.includes("windows") ? "windows" : "linux", name === "bharatcode" ? "universal" : name.includes("arm64") ? "arm64" : "x64", "not-applicable", `${name}-${process.env.CLI_VERSION}.tgz`)))
            const windows = await artifact(expectedKeys[17], "windows", "x64", "unsigned", "bharatcode-desktop-next-beta-win-x64.exe")
            const runtimeManifestPath = one("bharatcode-wsl-runtime-manifest.json")
            const wslGateResult = process.env.WSL_ACCEPTANCE_MODE === "required" ? "PASS" : "OWNER_WAIVED"
            const wslFilename = wslGateResult === "PASS" ? "bharatcode-wsl-scenarios-9-10.json" : "bharatcode-wsl-acceptance-waiver.json"
            const wslPath = one(wslFilename)
            const wslBindings = { source_sha: process.env.SOURCE_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, desktop_sha256: windows.sha256, runtime_manifest_sha256: await digest(runtimeManifestPath) }
            if (wslGateResult === "PASS") validateLeanWslReceipt(await Bun.file(wslPath).json(), wslBindings)
            else validateLeanWslWaiver(await Bun.file(wslPath).json(), wslBindings)
            const currentBetaFixturePath = "packages/desktop/test/fixtures/current-beta-windows-x64.json"
            const currentBeta = parseCurrentBetaFixtureBytes(new Uint8Array(await Bun.file(currentBetaFixturePath).arrayBuffer()))
            const upgradePath = one("bharatcode-upgrade-rollback-windows-x64.json")
            parseLeanUpgradeReceiptBytes(new Uint8Array(await Bun.file(upgradePath).arrayBuffer()), { source_sha: process.env.SOURCE_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, current_beta: currentBeta, candidate: { key: expectedKeys[17], filename: windows.filename, bytes: windows.bytes, sha256: windows.sha256 } })
            const artifacts = [...cli, await artifact("desktop-linux-x64-appimage", "linux", "x64", "not-applicable", "bharatcode-desktop-next-beta-linux-x64.AppImage"), await artifact("desktop-linux-x64-deb", "linux", "x64", "not-applicable", "bharatcode-desktop-next-beta-linux-x64.deb"), await artifact("desktop-macos-arm64", "macos", "arm64", "apple-notarized-stapled", "bharatcode-desktop-next-beta-mac-arm64.zip"), await artifact("desktop-macos-x64", "macos", "x64", "apple-notarized-stapled", "bharatcode-desktop-next-beta-mac-x64.zip"), windows, await artifact("upgrade-rollback-windows-x64", "windows", "x64", "acceptance-receipt", "bharatcode-upgrade-rollback-windows-x64.json"), await artifact("wsl-gate", "windows-wsl2", "x64", wslGateResult === "PASS" ? "acceptance-receipt" : "owner-waiver-receipt", wslFilename)].sort((left, right) => left.key.localeCompare(right.key))
            if (JSON.stringify(artifacts.map((item) => item.key)) !== JSON.stringify(expectedKeys)) throw new Error("Assembled cohort key set drift")
            const manifest = { schema: "bharatcode-next-beta-cohort-v2", repository: "BharatCode-ai/bharatcode-desktop", source_sha: process.env.SOURCE_SHA, candidate_tag: `next-beta-${process.env.SOURCE_SHA.slice(0, 12)}`, desktop_version: process.env.DESKTOP_VERSION, cli_version: process.env.CLI_VERSION, wsl_runtime_version: process.env.DESKTOP_VERSION, channel: "beta", workflow: process.env.WORKFLOW_PATH, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT, wsl_gate_result: wslGateResult, wsl_receipt_sha256: artifacts.find((item) => item.key === "wsl-gate").sha256, artifacts, completed_at }
            validateLeanCohort(manifest, { source_sha: process.env.SOURCE_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT })
            const bytes = canonicalLeanJson(manifest)
            await Bun.write("bharatcode-next-beta-cohort.json", bytes)
            await Bun.write("bharatcode-next-beta-cohort.json.sha256", `${createHash("sha256").update(bytes).digest("hex")}  bharatcode-next-beta-cohort.json\n`)
          '

      - name: Attest closed cohort manifest
        id: attest_cohort
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bharatcode-next-beta-cohort.json
          show-summary: false

      - name: Stage cohort provenance
        env:
          BUNDLE_PATH: ${{ steps.attest_cohort.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" bharatcode-next-beta-cohort.json.intoto.jsonl

      - name: Upload unpublished closed cohort
        id: upload_cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp2-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-next-beta-cohort.json
            bharatcode-next-beta-cohort.json.sha256
            bharatcode-next-beta-cohort.json.intoto.jsonl
          if-no-files-found: error
          overwrite: ${{ false }}

      - name: Bind uploaded cohort archive digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_cohort.outputs.artifact-digest }}
        run: '[[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]'
