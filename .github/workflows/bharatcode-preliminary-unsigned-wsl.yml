name: BharatCode preliminary unsigned Windows WSL acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex source on dev for non-promotable unsigned WSL evidence
        required: true
        type: string

permissions:
  contents: read

env:
  ACCEPTED_WSL_SOURCE_SHA: d62707068ddfc939c11bb0457702defc6c60f202
  BHARATCODE_CHANNEL: beta
  OPENCODE_CHANNEL: beta
  SOURCE_SHA: ${{ inputs.source_sha }}
  VITE_OPENCODE_CHANNEL: beta
  WORKFLOW_PATH: .github/workflows/bharatcode-preliminary-unsigned-wsl.yml

jobs:
  admit-source:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      desktop_version: ${{ steps.identity.outputs.desktop_version }}
    steps:
      - name: Checkout the exact preliminary source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Admit immutable preliminary source
        id: identity
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_SHA" == "$SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git status --porcelain)" == "" ]]
          git merge-base --is-ancestor "$ACCEPTED_WSL_SOURCE_SHA" "$SOURCE_SHA"
          git diff --exit-code "$ACCEPTED_WSL_SOURCE_SHA" "$SOURCE_SHA" -- \
            packages/desktop/electron-builder.config.ts \
            packages/desktop/scripts/stage-wsl-runtime.ts \
            packages/desktop/scripts/wsl-windows-acceptance.mjs \
            packages/desktop/src/main/index.ts \
            packages/desktop/src/main/ipc.ts \
            packages/desktop/src/main/server.ts \
            packages/desktop/src/main/windows.ts \
            'packages/desktop/src/main/wsl-*' \
            packages/desktop/src/preload/index.ts \
            packages/desktop/src/preload/types.ts \
            packages/desktop/src/renderer/index.tsx \
            packages/opencode/script/build.ts \
            packages/opencode/src/cli/cmd/serve.ts \
            packages/opencode/src/server/wsl-desktop-transport.ts
          grep -F '"packageManager": "bun@1.3.14"' package.json
          [[ "$(bun --version)" == "1.3.14" ]]
          desktop_version="$(bun -e 'process.stdout.write((await Bun.file("packages/desktop/package.json").json()).version)')"
          [[ "$desktop_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'desktop_version=%s\n' "$desktop_version" >> "$GITHUB_OUTPUT"

  build-wsl-runtime:
    needs: admit-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the exact preliminary source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Build exact same-source WSL runtime input
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.admit-source.outputs.desktop_version }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --linker hoisted
          (
            cd packages/opencode
            OPENCODE_VERSION="$DESKTOP_VERSION" BHARATCODE_SOURCE_SHA="$SOURCE_SHA" \
              bun run script/build.ts --single --skip-install --skip-embed-web-ui --wsl-candidate
          )
          mkdir preliminary-runtime
          runtime="packages/opencode/dist/bharatcode-linux-x64/bin/bharatcode"
          cp "$runtime" preliminary-runtime/bharatcode-runtime-linux-x64-glibc
          bytes="$(stat -c %s preliminary-runtime/bharatcode-runtime-linux-x64-glibc)"
          sha256="$(sha256sum preliminary-runtime/bharatcode-runtime-linux-x64-glibc | cut -d ' ' -f 1)"
          RUNTIME_BYTES="$bytes" RUNTIME_SHA256="$sha256" bun --eval '
            const value = { schema: 1, source_sha: process.env.SOURCE_SHA, version: process.env.DESKTOP_VERSION, arch: "x64", filename: "bharatcode-runtime-linux-x64-glibc", bytes: Number(process.env.RUNTIME_BYTES), sha256: process.env.RUNTIME_SHA256 }
            await Bun.write("preliminary-runtime/manifest.json", `${JSON.stringify(value)}\n`)
          '
          chmod 444 preliminary-runtime/bharatcode-runtime-linux-x64-glibc preliminary-runtime/manifest.json

      - name: Upload same-run preliminary runtime input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preliminary-wsl-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: preliminary-runtime
          if-no-files-found: error
          overwrite: ${{ false }}
          retention-days: 1

  package-preliminary-unsigned-windows:
    needs: [admit-source, build-wsl-runtime]
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout the exact preliminary source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download same-run preliminary runtime input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preliminary-wsl-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: preliminary-runtime
          digest-mismatch: error

      - name: Install exact dependencies and stage same-source runtime
        shell: pwsh
        env:
          INTEGRATED_HEAD: ${{ inputs.source_sha }}
        run: |
          $env:ELECTRON_BUILDER_CACHE = [IO.Path]::Combine($env:RUNNER_TEMP, "bharatcode-preliminary-electron-builder-cache", "nsis-3.0.4.1")
          "ELECTRON_BUILDER_CACHE=$env:ELECTRON_BUILDER_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          bun install --frozen-lockfile --linker hoisted
          $runtime = (Resolve-Path preliminary-runtime/bharatcode-runtime-linux-x64-glibc).Path
          $manifest = (Resolve-Path preliminary-runtime/manifest.json).Path
          Set-ItemProperty -LiteralPath $runtime -Name IsReadOnly -Value $true
          Set-ItemProperty -LiteralPath $manifest -Name IsReadOnly -Value $true
          $env:BHARATCODE_WSL_RUNTIME = $runtime
          $env:BHARATCODE_WSL_RUNTIME_MANIFEST = $manifest
          $env:BHARATCODE_WSL_RUNTIME_ARCH = "x64"
          bun run --cwd packages/desktop stage:wsl-runtime

      - name: Build and verify unsigned TEST-only NSIS
        working-directory: packages/desktop
        shell: pwsh
        env:
          BHARATCODE_ALLOW_UNSIGNED_WINDOWS: "1"
          INTEGRATED_HEAD: ${{ inputs.source_sha }}
        run: |
          bun run typecheck
          bun run build
          bunx electron-builder --win nsis --x64 --config electron-builder.config.ts --publish never
          $files = @(Get-ChildItem dist -File -Filter *.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one unsigned TEST-only NSIS" }
          $target = "$env:GITHUB_WORKSPACE/bharatcode-desktop-preliminary-unsigned-test-win-x64.exe"
          Move-Item $files[0].FullName $target
          $signature = Get-AuthenticodeSignature $target
          if ($signature.Status -ne "NotSigned" -or $signature.SignerCertificate -or $signature.TimeStamperCertificate) {
            throw "Preliminary Windows TEST artifact must be unsigned"
          }
          $version = (Get-Item $target).VersionInfo.ProductVersion
          if ([version]$version -ne [version]'${{ needs.admit-source.outputs.desktop_version }}') {
            throw "Preliminary Windows package version drift"
          }
          $env:PRELIMINARY_INSTALLER = $target
          bun --eval '
            const bytes = Buffer.from(await Bun.file(process.env.PRELIMINARY_INSTALLER).arrayBuffer())
            if (bytes.length < 4 || bytes.subarray(0, 2).toString("ascii") !== "MZ" || !bytes.includes(Buffer.from("PE\0\0"))) throw new Error("Preliminary installer is not PE")
          '
          Copy-Item resources/wsl-runtime/manifest.json "$env:GITHUB_WORKSPACE/bharatcode-wsl-runtime-manifest.json"
          Copy-Item resources/wsl-runtime/bharatcode-runtime-linux-x64-glibc "$env:GITHUB_WORKSPACE/bharatcode-runtime-linux-x64-glibc"

      - name: Run Windows namespace authority hostile tests
        shell: pwsh
        env:
          BHARATCODE_PRELIMINARY_CONTROLLER_TEST: "1"
        run: packages/desktop/scripts/wsl-windows-preliminary-controller.test.ps1

      - name: Upload same-run unsigned TEST-only package inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preliminary-wsl-unsigned-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bharatcode-desktop-preliminary-unsigned-test-win-x64.exe
            bharatcode-wsl-runtime-manifest.json
            bharatcode-runtime-linux-x64-glibc
          if-no-files-found: error
          overwrite: ${{ false }}
          retention-days: 1

  accept-preliminary-unsigned-wsl:
    needs: [admit-source, package-preliminary-unsigned-windows]
    runs-on: [self-hosted, windows, x64, wsl2, "bharatcode-acceptance-${{ github.run_id }}-${{ github.run_attempt }}"]
    permissions:
      contents: read
    steps:
      - name: Checkout the exact preliminary source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download same-run unsigned TEST-only package inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preliminary-wsl-unsigned-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: preliminary-input
          digest-mismatch: error

      - name: Initialize exact disposable WSL recovery state
        shell: pwsh
        env:
          WSL_DISTRIBUTION: ${{ vars.BHARATCODE_WSL_DISTRIBUTION }}
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = (Resolve-Path "preliminary-input/bharatcode-runtime-linux-x64-glibc").Path
          $manifestPath = (Resolve-Path "preliminary-input/bharatcode-wsl-runtime-manifest.json").Path
          $manifestText = [IO.File]::ReadAllText($manifestPath)
          if (-not $manifestText.EndsWith("`n") -or $manifestText.Contains("`r")) { throw "Preliminary runtime manifest is not canonical" }
          $manifest = $manifestText | ConvertFrom-Json
          $keys = @($manifest.PSObject.Properties.Name | Sort-Object)
          $expectedKeys = @("arch", "bytes", "filename", "schema", "sha256", "source_sha", "version") | Sort-Object
          if (($keys -join "`n") -cne ($expectedKeys -join "`n")) { throw "Preliminary runtime manifest is not closed" }
          if ($manifest.schema -ne 1 -or $manifest.arch -cne "x64" -or $manifest.filename -cne "bharatcode-runtime-linux-x64-glibc" -or $manifest.source_sha -cne $env:SOURCE_SHA) { throw "Preliminary runtime manifest identity is invalid" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $runtime).Hash.ToLowerInvariant() -cne [string]$manifest.sha256) { throw "Preliminary runtime digest mismatch" }
          $distribution = $env:WSL_DISTRIBUTION
          if ($distribution -cnotmatch '^[A-Za-z0-9._-]{1,128}$') { throw "Preliminary WSL distribution identity is invalid" }
          $userOutput = & wsl.exe --distribution $distribution --exec /usr/bin/id -un
          if ($LASTEXITCODE -ne 0) { throw "Preliminary WSL user query failed" }
          $user = ($userOutput | Out-String).Trim()
          if ($user -cnotmatch '^[a-z_][a-z0-9_-]{0,31}$') { throw "Preliminary WSL user identity is invalid" }
          $passwdOutput = & wsl.exe --distribution $distribution --exec /usr/bin/getent passwd $user
          if ($LASTEXITCODE -ne 0) { throw "Preliminary WSL passwd query failed" }
          $passwd = ($passwdOutput | Out-String).Trim().Split(":")
          if ($passwd.Count -ne 7 -or $passwd[0] -cne $user -or $passwd[2] -cne "1000" -or $passwd[5] -cnotmatch '^/[A-Za-z0-9._/-]+$') { throw "Preliminary WSL non-root identity is invalid" }
          $guestHome = $passwd[5]
          $runtimePathOutput = & wsl.exe --distribution $distribution --exec /usr/bin/wslpath -a -u $runtime
          if ($LASTEXITCODE -ne 0) { throw "Preliminary runtime path translation failed" }
          $linuxRuntime = ($runtimePathOutput | Out-String).Trim()
          if ($linuxRuntime -cnotmatch '^/[A-Za-z0-9._/ -]+$') { throw "Preliminary Linux runtime path is invalid" }
          $runtimeEnvironment = @(
            "--distribution", $distribution, "--user", $user, "--cd", $guestHome, "--exec", "/usr/bin/env", "-i",
            "HOME=$guestHome", "USER=$user", "LOGNAME=$user",
            "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin", "BHARATCODE_CHANNEL=beta", "TMPDIR=/tmp"
          )
          $statusOutput = & wsl.exe @runtimeEnvironment $linuxRuntime recovery status --json
          if ($LASTEXITCODE -ne 0) { throw "Preliminary recovery status failed" }
          if (($statusOutput | Out-String).Trim() -cne '{"state":"start-fresh","reason":"no-source"}') { throw "Preliminary recovery state is not an exact fresh guest" }
          $resultOutput = & wsl.exe @runtimeEnvironment $linuxRuntime recovery start-fresh --confirm --json
          if ($LASTEXITCODE -ne 0) { throw "Preliminary recovery initialization failed" }
          if (($resultOutput | Out-String).Trim() -cne '{"state":"ready"}') { throw "Preliminary recovery initialization did not reach ready" }

      - name: Run one handle-bound installed Desktop preliminary transaction
        shell: pwsh
        env:
          WSL_DISTRIBUTION: ${{ vars.BHARATCODE_WSL_DISTRIBUTION }}
          WSL_INVALID_DISTRIBUTION: ${{ vars.BHARATCODE_WSL_INVALID_DISTRIBUTION }}
          WSL_MISSING_PREREQUISITE_DISTRIBUTION: ${{ vars.BHARATCODE_WSL_MISSING_PREREQUISITE_DISTRIBUTION }}
          WSL_WINDOWS_PROJECT: ${{ vars.BHARATCODE_WSL_WINDOWS_PROJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          . ./packages/desktop/scripts/wsl-windows-preliminary-controller.ps1
          $installer = (Resolve-Path preliminary-input/bharatcode-desktop-preliminary-unsigned-test-win-x64.exe).Path
          $adapter = (Resolve-Path "packages/desktop/scripts/wsl-windows-preliminary-acceptance.mjs").Path
          $validator = (Resolve-Path "packages/opencode/script/lean-preliminary-unsigned-wsl.mjs").Path
          $harness = (Resolve-Path "packages/desktop/scripts/wsl-windows-acceptance.mjs").Path
          $runtimeManifest = (Resolve-Path "preliminary-input/bharatcode-wsl-runtime-manifest.json").Path
          $runtime = (Resolve-Path "preliminary-input/bharatcode-runtime-linux-x64-glibc").Path
          $receipt = Join-Path $env:GITHUB_WORKSPACE "bharatcode-wsl-preliminary-unsigned.json"
          $evidenceScript = @'
            import { createHash } from "node:crypto"
            import { open, stat } from "node:fs/promises"
            import { runPreliminaryWindowsAcceptance } from "./contracts/wsl-windows-preliminary-acceptance.mjs"
            import { canonicalPreliminaryUnsignedWslJson } from "./contracts/lean-preliminary-unsigned-wsl.mjs"
            const manifest = process.env.PRELIMINARY_RUNTIME_MANIFEST
            const runtime = process.env.PRELIMINARY_RUNTIME
            const harnessPath = process.env.PRELIMINARY_FROZEN_HARNESS
            const harnessContract = "packages/desktop/scripts/wsl-windows-acceptance.mjs"
            const adapter = process.env.PRELIMINARY_ADAPTER
            const validator = process.env.PRELIMINARY_VALIDATOR
            const evidenceScript = process.env.PRELIMINARY_EVIDENCE_SCRIPT
            const argv = [
              "--desktop-exe", process.env.INSTALLED_DESKTOP_EXE,
              "--runtime-manifest", manifest,
              "--distribution", process.env.WSL_DISTRIBUTION,
              "--invalid-distribution", process.env.WSL_INVALID_DISTRIBUTION,
              "--missing-prerequisite-distribution", process.env.WSL_MISSING_PREREQUISITE_DISTRIBUTION,
              "--windows-project", process.env.WSL_WINDOWS_PROJECT,
              "--source-sha", process.env.SOURCE_SHA,
              "--acceptance-dir", process.env.PRELIMINARY_ACCEPTANCE_DIR,
            ]
            const result = await runPreliminaryWindowsAcceptance(argv)
            if (result.authority !== "PRELIMINARY_UNSIGNED" || result.harness_authority !== "DIAGNOSTIC" || !result.evidence) throw new Error("Preliminary harness authority drift")
            const digest = async (path) => createHash("sha256").update(new Uint8Array(await Bun.file(path).arrayBuffer())).digest("hex")
            const installerStat = await stat(process.env.UNSIGNED_INSTALLER_PATH)
            const installedStat = await stat(process.env.INSTALLED_DESKTOP_EXE)
            const bindings = {
              adapter_sha256: await digest(adapter),
              evidence_script_sha256: await digest(evidenceScript),
              source_sha: process.env.SOURCE_SHA,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              unsigned_installer_bytes: installerStat.size,
              unsigned_installer_sha256: await digest(process.env.UNSIGNED_INSTALLER_PATH),
              installed_desktop_bytes: installedStat.size,
              installed_desktop_sha256: await digest(process.env.INSTALLED_DESKTOP_EXE),
              runtime_manifest_sha256: await digest(manifest),
              runtime_sha256: await digest(runtime),
              harness_sha256: await digest(harnessPath),
              validator_sha256: await digest(validator),
            }
            if (bindings.runtime_sha256 !== result.evidence.runtime.manifest_sha256) throw new Error("Preliminary raw runtime digest drift")
            const receipt = {
              schema: "bharatcode-wsl-preliminary-unsigned-v1",
              evidence_class: "PRELIMINARY_UNSIGNED",
              result: "PRELIMINARY_UNSIGNED",
              signature_status: "PRELIMINARY_UNSIGNED",
              provenance_status: "PRELIMINARY_UNSIGNED",
              cleanup_complete: true,
              promotable: false,
              composable: false,
              controller_inputs: { adapter_sha256: bindings.adapter_sha256, evidence_script_sha256: bindings.evidence_script_sha256, validator_sha256: bindings.validator_sha256 },
              repository: "BharatCode-ai/bharatcode-desktop",
              workflow: process.env.WORKFLOW_PATH,
              source_sha: result.evidence.source_sha,
              github: { run_id: Number(process.env.GITHUB_RUN_ID), run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT) },
              unsigned_installer: { filename: "bharatcode-desktop-preliminary-unsigned-test-win-x64.exe", bytes: bindings.unsigned_installer_bytes, sha256: bindings.unsigned_installer_sha256 },
              installed_desktop: { filename: "BharatCode Beta.exe", bytes: bindings.installed_desktop_bytes, sha256: result.evidence.desktop_sha256 },
              runtime_manifest_sha256: result.evidence.runtime_manifest_sha256,
              runtime: result.evidence.runtime,
              harness: { contract: harnessContract, contract_sha256: bindings.harness_sha256, authority: result.harness_authority },
              identity: result.evidence.identity,
              scenarios: result.evidence.scenarios,
              completed_at: result.evidence.completed_at,
            }
            const bytes = canonicalPreliminaryUnsignedWslJson(receipt, bindings)
            const output = await open(process.env.PRELIMINARY_RECEIPT_CANDIDATE, "wx", 0o444)
            try {
              await output.writeFile(bytes)
              await output.sync()
            } finally {
              await output.close()
            }
          '@
          Invoke-PreliminaryController `
            -RunnerTemp $env:RUNNER_TEMP `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT `
            -Installer $installer `
            -ExpectedVersion '${{ needs.admit-source.outputs.desktop_version }}' `
            -AdapterPath $adapter `
            -ValidatorPath $validator `
            -FrozenHarnessPath $harness `
            -RuntimeManifestPath $runtimeManifest `
            -RuntimePath $runtime `
            -EvidenceScript $evidenceScript `
            -ReceiptPath $receipt

      - name: Prove preliminary namespace absence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./packages/desktop/scripts/wsl-windows-preliminary-controller.ps1
          Assert-PreliminaryNamespacePrefixAbsent `
            -RunnerTemp $env:RUNNER_TEMP `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Upload run-attempt-scoped preliminary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preliminary-wsl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: bharatcode-wsl-preliminary-unsigned.json
          if-no-files-found: error
          overwrite: ${{ false }}
          retention-days: 1
