name: BharatCode Desktop candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact committed source (must equal the selected workflow ref)
        required: true
        type: string
      channel:
        description: Candidate channel
        required: true
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BHARATCODE_SOURCE_SHA: ${{ inputs.source_sha }}
  BHARATCODE_CHANNEL: ${{ inputs.channel }}

jobs:
  admit:
    if: github.repository == 'BharatCode-ai/bharatcode-desktop' && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - id: identity
        run: bun packages/desktop/scripts/candidate-cohort.ts admit
      - name: Candidate validation
        working-directory: packages/desktop
        run: bun test scripts/candidate-cohort.test.ts scripts/packaging.test.ts

  wsl:
    needs: admit
    runs-on: ubuntu-24.04
    env:
      BHARATCODE_VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - run: bun packages/desktop/scripts/candidate-cohort.ts admit
      - name: Same-source Linux runtime for Windows
        working-directory: packages/opencode
        run: bun script/build.ts --single --skip-install --skip-embed-web-ui --wsl-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/opencode/dist/wsl-runtime-x64/*
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [admit, wsl]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            arch: x64
          - target: darwin-arm64
            runner: macos-26
            arch: arm64
          - target: darwin-x64
            runner: macos-26-intel
            arch: x64
          - target: linux-x64
            runner: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      BHARATCODE_VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - name: Preserve canonical checkout bytes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Native Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $compiler = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $compiler -or $LASTEXITCODE -ne 0) { throw 'Windows C++ toolchain unavailable' }
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - run: bun packages/desktop/scripts/candidate-cohort.ts admit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows'
        with:
          name: wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl-runtime
      - name: Stage exact runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('bharatcode-runtime-linux-x64-glibc', 'manifest.json')) {
            $file = Get-Item -LiteralPath "$env:RUNNER_TEMP/wsl-runtime/$name"
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Invalid WSL artifact transport' }
            $file.IsReadOnly = $true
          }
          "BHARATCODE_WSL_RUNTIME=$env:RUNNER_TEMP/wsl-runtime/bharatcode-runtime-linux-x64-glibc" >> $env:GITHUB_ENV
          "BHARATCODE_WSL_RUNTIME_MANIFEST=$env:RUNNER_TEMP/wsl-runtime/manifest.json" >> $env:GITHUB_ENV
          "BHARATCODE_WSL_RUNTIME_ARCH=x64" >> $env:GITHUB_ENV
      - name: Build same-source CLI, server and renderer
        working-directory: packages/desktop
        run: |
          bun scripts/prebuild.ts
          bun x electron-vite build
      - name: Package Windows (unsigned beta policy)
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        env:
          BHARATCODE_ALLOW_UNSIGNED_WINDOWS: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun x electron-builder --config electron-builder.config.ts --win --x64 --publish never
      - name: Package Linux
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun x electron-builder --config electron-builder.config.ts --linux --x64 --publish never
      - name: Package macOS (Developer ID and notarization required)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun -e 'const fs=require("node:fs"); if(!process.env.APPLE_KEY_CONTENT) throw Error("Missing notarization key"); fs.writeFileSync(process.env.APPLE_API_KEY,process.env.APPLE_KEY_CONTENT,{mode:0o600,flag:"wx"})'
          unset APPLE_KEY_CONTENT
          bun x electron-builder --config electron-builder.config.ts --mac zip --${{ matrix.arch }} --publish never --config.forceCodeSigning=true
      - name: Remove temporary notarization key
        if: always() && runner.os == 'macOS'
        run: |
          bun -e 'require("node:fs").rmSync(require("node:path").join(process.env.RUNNER_TEMP,"apple-api-key.p8"),{force:true})'
      - name: Verify and record candidate
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/candidate
        run: bun packages/desktop/scripts/candidate-cohort.ts record "$CANDIDATE_DIRECTORY" "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  cohort:
    needs: [admit, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded
      - name: Assemble complete immutable cohort
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/downloaded
        run: |
          bun packages/desktop/scripts/candidate-cohort.ts collect "$CANDIDATE_DIRECTORY"
          bun packages/desktop/scripts/candidate-cohort.ts assemble "$CANDIDATE_DIRECTORY/cohort"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded/cohort
          if-no-files-found: error
          retention-days: 14
