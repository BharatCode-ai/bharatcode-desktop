name: generated-clients

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      OPENCODE_TEST_HOME: ${{ runner.temp }}/sdk-home
      XDG_DATA_HOME: ${{ runner.temp }}/sdk-home/data
      XDG_STATE_HOME: ${{ runner.temp }}/sdk-home/state
      XDG_CONFIG_HOME: ${{ runner.temp }}/sdk-home/config
      XDG_CACHE_HOME: ${{ runner.temp }}/sdk-home/cache
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_DISABLE_AUTOUPDATE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate legacy SDK
        run: bun ./packages/sdk/js/script/build.ts

      - name: Generate current client
        run: bun run generate
        working-directory: packages/client

      - name: Require committed generated clients
        run: |
          git diff --exit-code -- packages/sdk/js/src packages/client/src/generated packages/client/src/generated-effect
          test -z "$(git status --porcelain -- packages/sdk/js/src packages/client/src/generated packages/client/src/generated-effect)"
