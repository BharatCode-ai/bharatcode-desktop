name: BharatCode CLI candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact committed source (must equal the selected workflow ref)
        required: true
        type: string
      channel:
        description: Candidate channel
        required: true
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  contents: read

env:
  BHARATCODE_SOURCE_SHA: ${{ inputs.source_sha }}
  BHARATCODE_CHANNEL: ${{ inputs.channel }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Admit exact source
        run: bun packages/desktop/scripts/candidate-cohort.ts admit
      - name: Verify package assembly
        working-directory: packages/opencode
        run: bun test script/pack.test.ts
      - name: Cross-compile all CLI platforms
        working-directory: packages/opencode
        run: bun run build
      - name: Pack complete cohort and record source
        run: |
          bun packages/opencode/script/pack.ts packages/opencode/dist "$RUNNER_TEMP/cli-candidate"
          bun packages/desktop/scripts/candidate-cohort.ts admit > "$RUNNER_TEMP/cli-candidate/source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-candidate/*
          if-no-files-found: error
          retention-days: 14
