name: BharatCode publish tested candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA of the tested Desktop candidate
        required: true
        type: string
      build_run_id:
        description: Successful Desktop candidate workflow run (no rebuild)
        required: true
        type: string
      build_run_attempt:
        description: Exact successful attempt that produced the tested artifacts
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the tested artifact's cohort.json
        required: true
        type: string
      manual_acceptance_confirmed:
        description: I approve publication of these exact tested artifacts and documented limitations
        required: true
        type: boolean
        default: false
      approve_unsigned_windows:
        description: I explicitly approve the tested unsigned Windows installer for this stable release
        required: true
        type: boolean
        default: false
      acceptance_notes:
        description: Tester, date, OS/architectures, checklist results and explicitly approved limitations
        required: true
        type: string
      notify_website:
        description: Notify the website only after publication and download verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize against earlier beta workflow runs as well as stable retries.
  group: desktop-beta-publication
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_RUN_ID: ${{ inputs.build_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
  CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}

jobs:
  publish:
    if: inputs.manual_acceptance_confirmed && inputs.approve_unsigned_windows && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Reuse the protected environment; do not auto-create an unprotected one.
    environment: desktop-beta-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify original producer and explicit acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_NOTES: ${{ inputs.acceptance_notes }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'BharatCode-ai/bharatcode-desktop' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "${ACCEPTANCE_NOTES//[[:space:]]/}" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT" \
            | jq -e --arg sha "$SOURCE_SHA" --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" '
              (.id | tostring) == $run and (.run_attempt | tostring) == $attempt and
              .head_sha == $sha and .event == "workflow_dispatch" and
              .status == "completed" and .conclusion == "success" and
              .repository.full_name == "BharatCode-ai/bharatcode-desktop" and
              .path == ".github/workflows/publish.yml"
            ' > /dev/null

      - name: Checkout protected publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tested-source
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup pinned Bun without installing or rebuilding
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Download the exact tested cohort
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: desktop-cohort-${{ inputs.build_run_id }}-${{ inputs.build_run_attempt }}
          path: ${{ runner.temp }}/tested-cohort
      - name: Verify all bytes and assemble updater metadata
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          bun packages/desktop/scripts/stage-tested-release.ts "$RUNNER_TEMP/tested-cohort" "$RUNNER_TEMP/release-assets" tested-source

      - name: Reconcile and verify immutable stable release then one-time compatibility metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
          ACCEPTANCE_NOTES: ${{ inputs.acceptance_notes }}
          MANUAL_ACCEPTANCE: ${{ inputs.manual_acceptance_confirmed }}
          APPROVE_UNSIGNED_WINDOWS: ${{ inputs.approve_unsigned_windows }}
        shell: bash
        run: bash packages/desktop/scripts/publish-tested-release.sh "$RUNNER_TEMP/release-assets"

      - name: Notify website only after download verification
        if: inputs.notify_website
        env:
          GH_TOKEN: ${{ secrets.BHARATCODE_WEBSITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg tag "$RELEASE_TAG" \
            '{event_type:"desktop_release_published",client_payload:{repo:$repo,tag:$tag,channel:"stable",release_url:("https://github.com/"+$repo+"/releases/tag/"+$tag)}}' \
            | gh api repos/BharatCode-ai/bharatcode/dispatches --method POST --input -
