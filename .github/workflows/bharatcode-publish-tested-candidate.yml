name: BharatCode publish tested candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA of the manually tested candidate
        required: true
        type: string
      build_run_id:
        description: Successful Build release candidate run ID (no rebuild is performed)
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of desktop-candidate.tar.gz recorded before manual testing
        required: true
        type: string
      manual_acceptance_confirmed:
        description: I completed and approved the platform checklist for these exact artifacts
        required: true
        default: false
        type: boolean
      acceptance_notes:
        description: Tester, date, tested OS/architectures, checklist results, and explicitly approved limitations
        required: true
        type: string
      notify_website:
        description: Notify the website after publication and successful download checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-beta-publication
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_RUN_ID: ${{ inputs.build_run_id }}
  CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}

jobs:
  publish:
    if: inputs.manual_acceptance_confirmed && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: desktop-beta-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check operator approval and build identity
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_NOTES: ${{ inputs.acceptance_notes }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$ACCEPTANCE_NOTES" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          jq -e --arg sha "$SOURCE_SHA" --arg run "$SOURCE_RUN_ID" '
            (.id | tostring) == $run and .head_sha == $sha and .event == "workflow_dispatch" and
            .conclusion == "success" and .path == ".github/workflows/bharatcode-next-beta-candidate.yml"
          ' "$RUNNER_TEMP/candidate-run.json" > /dev/null

      - name: Checkout exact candidate tooling, not moving branch HEAD
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Setup repository-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Download the tested archive from its original run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: desktop-candidate-${{ inputs.build_run_id }}
          path: candidate-download
          digest-mismatch: error
      - name: Verify archive and standard GitHub provenance before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          cd candidate-download
          printf '%s  desktop-candidate.tar.gz\n' "$CANDIDATE_SHA256" | sha256sum --check -
          gh attestation verify desktop-candidate.tar.gz --bundle desktop-candidate.tar.gz.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" --source-digest "$SOURCE_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bharatcode-next-beta-candidate.yml" \
            --predicate-type https://slsa.dev/provenance/v1
          # The archive is flat: reject traversal, links, devices, and extra directories.
          tar -tzf desktop-candidate.tar.gz > "$RUNNER_TEMP/candidate-entries.txt"
          if grep -Ev '^(\./)?[A-Za-z0-9][A-Za-z0-9._-]*$|^\./$' "$RUNNER_TEMP/candidate-entries.txt"; then exit 1; fi
          if tar -tvzf desktop-candidate.tar.gz | grep -Ev '^[-d]'; then exit 1; fi
          mkdir ../release-assets
          tar -xzf desktop-candidate.tar.gz -C ../release-assets --no-same-owner
          cd ..
          bun packages/desktop/scripts/batch-release.mjs verify
          (cd release-assets && sha256sum --check SHA256SUMS)
          tag="$(jq -r .tag release-assets/release-manifest.json)"
          [[ "$tag" =~ ^desktop-beta-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Record manual acceptance and create a new draft without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_NOTES: ${{ inputs.acceptance_notes }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" -H "X-GitHub-Api-Version: 2026-03-10" | jq -e '.enabled == true'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing overwrite; investigate or abandon the candidate.' >&2; exit 1
          fi
          [[ -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")" ]]
          {
            echo 'BharatCode Desktop beta. Windows and Linux are unsigned. Both macOS architectures are Developer ID signed and notarized.'
            echo
            echo "Source: $SOURCE_SHA"
            echo "Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
            echo "Tested archive SHA-256: $CANDIDATE_SHA256"
            echo "Manual acceptance approved by $GITHUB_ACTOR at $(date -u +%FT%TZ):"
            printf '%s\n' "$ACCEPTANCE_NOTES"
            echo
            echo 'Automated Hyper-V/JIT and upgrade/rollback harnesses were not run; manual acceptance is not an automated PASS.'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "BharatCode $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"

      - name: Verify draft hashes, then publish those same files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-state.json
          bun packages/desktop/scripts/batch-release.mjs check-release draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-state.json
          bun packages/desktop/scripts/batch-release.mjs check-release published
          jq -r '.assets[].browser_download_url' release-state.json > "$RUNNER_TEMP/release-urls.txt"
          while IFS= read -r url; do
            curl --fail --silent --show-error --head --location --proto '=https' --proto-redir '=https' "$url" > /dev/null
          done < "$RUNNER_TEMP/release-urls.txt"

      - name: Notify website only after live downloads pass
        if: inputs.notify_website
        env:
          GH_TOKEN: ${{ secrets.BHARATCODE_WEBSITE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg tag "$RELEASE_TAG" \
            '{event_type:"desktop_release_published",client_payload:{repo:$repo,tag:$tag,channel:"beta",release_url:("https://github.com/"+$repo+"/releases/tag/"+$tag)}}' \
            | gh api repos/BharatCode-ai/bharatcode/dispatches --method POST --input -
