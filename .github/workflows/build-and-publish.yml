name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g., 1.15.30)
        required: true
        type: string
      npm_tag:
        description: npm dist-tag to publish under. Promote to latest separately once verified.
        required: true
        default: next
        type: choice
        options: [next, latest]
      publish_npm:
        description: Publish to npm
        required: true
        default: true
        type: boolean
      publish_github:
        description: Create GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  # Bun cross-compiles every target, so one Linux runner produces all 12
  # platform packages. No build matrix, and no --single (which would filter
  # PLATFORM_TARGETS down to the runner's own platform).
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all platform binaries
        run: |
          cd packages/opencode
          OPENCODE_VERSION="$VERSION" bun run script/build.ts

      - name: Assemble meta package and pack all tarballs
        run: |
          cd packages/opencode
          mkdir -p ../../out dist/bharatcode/bin dist/bharatcode/script
          cp bin/bharatcode.mjs dist/bharatcode/bin/bharatcode.mjs
          cp script/distribution.mjs dist/bharatcode/script/distribution.mjs
          bun --eval '
            const names = [...new Bun.Glob("*/package.json").scanSync({ cwd: "./dist" })]
              .map((p) => p.split("/")[0])
              .filter((n) => n !== "bharatcode")
              .sort()
            if (names.length !== 12) throw new Error(`expected 12 platform packages, built ${names.length}: ${names}`)
            const version = process.env.VERSION
            await Bun.write("./dist/bharatcode/package.json", JSON.stringify({
              name: "bharatcode",
              version,
              repository: { type: "git", url: "git+https://github.com/BharatCode-ai/bharatcode-desktop.git" },
              type: "module",
              bin: { bharatcode: "bin/bharatcode.mjs" },
              files: ["bin", "script/distribution.mjs"],
              optionalDependencies: Object.fromEntries(names.map((n) => [n, version])),
              os: ["darwin", "linux", "win32"],
              cpu: ["arm64", "x64"],
            }, null, 2))
          '
          # Platform packages first, meta last - publish order depends on it.
          for dir in dist/*/; do
            name=$(basename "$dir")
            if [ "$name" = "bharatcode" ]; then continue; fi
            chmod -R 755 "$dir"
            (cd "$dir" && bun pm pack --destination ../../../../out)
          done
          (cd dist/bharatcode && bun pm pack --destination ../../../../out)
          ls -la ../../out

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: out/*.tgz
          if-no-files-found: error

  # Trusted publishing (OIDC): no NPM_TOKEN. Requires a trusted publisher
  # registered on npmjs.com for this repo + this workflow filename, per package.
  publish-npm:
    needs: build
    if: inputs.publish_npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: out/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform packages, then meta
        run: |
          set -euo pipefail
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
          meta="out/bharatcode-$VERSION.tgz"
          for tgz in out/*.tgz; do
            if [ "$tgz" = "$meta" ]; then continue; fi
            npm publish "$tgz" --access public --provenance --tag "${{ inputs.npm_tag }}"
          done
          npm publish "$meta" --access public --provenance --tag "${{ inputs.npm_tag }}"

  # Draft first, attach assets, then publish. Immutable releases seal a release
  # on publish, so assets must be attached while it is still a draft.
  create-release:
    needs: build
    if: inputs.publish_github
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: out/

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" out/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --generate-notes \
            --prerelease \
            --draft

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
