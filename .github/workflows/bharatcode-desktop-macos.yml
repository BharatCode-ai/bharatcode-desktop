name: BharatCode Desktop macOS

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      channel:
        description: BharatCode release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - prod
      tag:
        description: GitHub Release tag to create/update. Defaults to desktop-<channel>-<date>-<run>.
        required: false
        type: string
      publish_release:
        description: Upload the macOS zips to a GitHub Release.
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark a newly-created workflow-dispatch release as a prerelease.
        required: true
        default: true
        type: boolean
      draft:
        description: Create a workflow-dispatch release as draft.
        required: true
        default: false
        type: boolean
      update_homebrew_tap:
        description: Update BharatCode-ai/homebrew-tap after macOS assets upload.
        required: true
        default: true
        type: boolean
      notify_website:
        description: Send a repository_dispatch to BharatCode website after release upload.
        required: true
        default: true
        type: boolean
      allow_unsigned:
        description: "Emergency fallback: package unsigned macOS zips instead of signed/notarized zips."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG_FROM_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_NAME_FROM_EVENT: ${{ github.event.release.name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG_FROM_EVENT"
            name="$RELEASE_NAME_FROM_EVENT"
            if [[ "$tag" == *dev* ]]; then
              channel="dev"
            elif [[ "$tag" == *prod* ]]; then
              channel="prod"
            elif [[ "$tag" == *beta* ]]; then
              channel="beta"
            elif [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
              channel="beta"
            else
              channel="prod"
            fi
          else
            channel="$INPUT_CHANNEL"
            tag="$INPUT_TAG"
            if [[ -z "$tag" ]]; then
              tag="desktop-$channel-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
            fi
            title_channel="$(tr '[:lower:]' '[:upper:]' <<< "${channel:0:1}")${channel:1}"
            name="BharatCode Desktop $title_channel $tag"
          fi

          if [[ -z "$name" ]]; then
            name="BharatCode Desktop $tag"
          fi

          if [[ "$channel" == "dev" ]]; then
            echo "::error::Refusing to publish dev-channel macOS artifacts."
            exit 1
          fi

          {
            echo "channel=$channel"
            echo "release_tag=$tag"
            echo "release_name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release for workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; assets will be updated."
            exit 0
          fi

          args=(
            release create "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_NAME"
            --notes "BharatCode Desktop macOS zips generated by GitHub Actions. Windows/Linux assets may be attached by their platform workflows."
          )
          if [[ "${{ inputs.draft }}" == "true" ]]; then args+=(--draft); fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then args+=(--prerelease); fi
          set +e
          gh "${args[@]}"
          create_status=$?
          set -e
          if (( create_status != 0 )); then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $RELEASE_TAG was created concurrently; assets will be updated."
              exit 0
            fi
            exit "$create_status"
          fi

  package-macos:
    name: Package signed/notarized macOS app (${{ matrix.arch }})
    needs: resolve-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BHARATCODE_ALLOW_UNSIGNED_MAC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' && '1' || '0' }}
      # GitHub-hosted jobs are capped at 6h; give first-time Apple notarization
      # queues nearly the full window while leaving a little time for stapling.
      BHARATCODE_NOTARY_TIMEOUT_MINUTES: "350"
      BHARATCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
      OPENCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      VITE_OPENCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install setuptools
        run: python -m pip install setuptools

      - name: Install dependencies
        timeout-minutes: 20
        run: bun install --linker hoisted

      - name: Validate macOS signing credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BHARATCODE_ALLOW_UNSIGNED_MAC" == "1" ]]; then
            echo "::warning::Packaging unsigned macOS zips because allow_unsigned was explicitly enabled."
            exit 0
          fi

          missing=()
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} )); then
            printf 'Missing macOS signing/notarization secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 - "$key_path" <<'PY'
          import base64
          import binascii
          import os
          import pathlib
          import sys

          value = os.environ["APPLE_API_KEY"].strip()
          path = pathlib.Path(sys.argv[1])
          payload = None
          try:
              decoded = base64.b64decode(value, validate=True)
              if b"BEGIN PRIVATE KEY" in decoded:
                  payload = decoded
          except binascii.Error:
              pass

          if payload is None:
              payload = value.encode("utf-8")

          if not payload.endswith(b"\n"):
              payload += b"\n"

          path.write_bytes(payload)
          PY
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package signed/notarized macOS zip
        working-directory: packages/desktop
        timeout-minutes: 358
        run: bunx electron-builder --mac zip --${{ matrix.arch }} --config electron-builder.config.ts --publish never

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BHARATCODE_ALLOW_UNSIGNED_MAC" == "1" ]]; then
            echo "Skipping signature verification for explicitly unsigned macOS packaging."
            exit 0
          fi

          app_path="$(find packages/desktop/dist -maxdepth 3 -type d -name '*.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "Could not find packaged .app under packages/desktop/dist." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

      - name: Print macOS checksum
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 "packages/desktop/dist/bharatcode-desktop-mac-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bharatcode-desktop-macos-${{ matrix.arch }}-${{ env.BHARATCODE_CHANNEL }}-${{ github.sha }}
          if-no-files-found: error
          path: packages/desktop/dist/bharatcode-desktop-mac-${{ matrix.arch }}.zip

      - name: Upload macOS zip to GitHub Release
        if: ${{ github.event_name == 'release' || inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "packages/desktop/dist/bharatcode-desktop-mac-${{ matrix.arch }}.zip" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  update-homebrew-tap:
    name: Update Homebrew tap
    needs:
      - resolve-release
      - package-macos
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' || inputs.publish_release) && (github.event_name == 'release' || inputs.update_homebrew_tap) }}
    env:
      BHARATCODE_ALLOW_UNSIGNED_MAC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_unsigned == 'true' && '1' || '0' }}
      BHARATCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Skip if tap token is absent
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: echo "Skipping Homebrew tap update; HOMEBREW_TAP_TOKEN is not configured."

      - name: Update BharatCode Homebrew cask
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/homebrew-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "bharatcode-desktop-mac-*.zip" \
            --dir dist/homebrew-assets \
            --clobber

          arm_asset="dist/homebrew-assets/bharatcode-desktop-mac-arm64.zip"
          x64_asset="dist/homebrew-assets/bharatcode-desktop-mac-x64.zip"
          test -f "$arm_asset"
          test -f "$x64_asset"

          app_version="$(node -p "require('./packages/desktop/package.json').version")"
          arm_sha="$(shasum -a 256 "$arm_asset" | awk '{print $1}')"
          x64_sha="$(shasum -a 256 "$x64_asset" | awk '{print $1}')"
          if [[ "$BHARATCODE_CHANNEL" == "prod" ]]; then
            app_bundle="BharatCode.app"
          else
            app_bundle="BharatCode Beta.app"
          fi
          if [[ "$BHARATCODE_ALLOW_UNSIGNED_MAC" == "1" ]]; then
            caveats_block='
            caveats <<~EOS
              BharatCode Desktop for macOS is an unsigned beta until BharatCode has Apple Developer signing and notarization.
              On first launch, right-click BharatCode and choose Open, or use System Settings > Privacy & Security > Open Anyway.
            EOS
          '
          else
            caveats_block=''
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/BharatCode-ai/homebrew-tap.git" dist/homebrew-tap
          mkdir -p dist/homebrew-tap/Casks
          cat > dist/homebrew-tap/Casks/bharatcode-desktop.rb <<CASK
          cask "bharatcode-desktop" do
            arch arm: "arm64", intel: "x64"

            version "${app_version},${RELEASE_TAG}"
            sha256 arm: "${arm_sha}",
                   intel: "${x64_sha}"

            url "https://github.com/BharatCode-ai/bharatcode-desktop/releases/download/#{version.csv.second}/bharatcode-desktop-mac-#{arch}.zip",
                verified: "github.com/BharatCode-ai/bharatcode-desktop/"
            name "BharatCode Desktop"
            desc "BharatCode coding assistant desktop app"
            homepage "https://bharatcode.ai"

            app "${app_bundle}", target: "BharatCode.app"
          ${caveats_block}

            zap trash: [
              "~/Library/Application Support/BharatCode",
              "~/Library/Logs/BharatCode",
              "~/Library/Preferences/ai.bharatcode.desktop.plist",
              "~/Library/Saved Application State/ai.bharatcode.desktop.savedState",
            ]
          end
          CASK

          cd dist/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bharatcode-desktop.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi
          git commit -m "Update bharatcode-desktop to ${RELEASE_TAG}"
          git push origin HEAD:main

  notify-website:
    name: Notify website
    needs:
      - resolve-release
      - package-macos
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' || inputs.publish_release) && (github.event_name == 'release' || inputs.notify_website) }}
    env:
      BHARATCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      GH_TOKEN: ${{ secrets.BHARATCODE_WEBSITE_DISPATCH_TOKEN }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Notify website to redeploy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Skipping website notification; BHARATCODE_WEBSITE_DISPATCH_TOKEN is not configured."
            exit 0
          fi

          gh api repos/BharatCode-ai/bharatcode/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "desktop_release_published",
            "client_payload": {
              "repo": "$GITHUB_REPOSITORY",
              "tag": "$RELEASE_TAG",
              "channel": "$BHARATCODE_CHANNEL",
              "release_url": "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            }
          }
          EOF
