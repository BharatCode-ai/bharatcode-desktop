name: BharatCode Desktop Windows

on:
  workflow_dispatch:
    inputs:
      channel:
        description: BharatCode release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - prod
          - dev

permissions:
  contents: read

jobs:
  package-windows:
    name: Package unsigned Windows app
    runs-on: windows-latest
    env:
      BHARATCODE_CHANNEL: ${{ inputs.channel }}
      BHARATCODE_ALLOW_UNSIGNED_WINDOWS: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install setuptools
        run: python -m pip install setuptools

      - name: Install dependencies
        timeout-minutes: 20
        run: bun install --linker hoisted

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package unsigned Windows installer
        working-directory: packages/desktop
        run: bunx electron-builder --win nsis --config electron-builder.config.ts --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bharatcode-desktop-windows-${{ inputs.channel }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml
