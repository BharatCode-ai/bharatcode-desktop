name: BharatCode Desktop Linux

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      channel:
        description: BharatCode release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - prod
      tag:
        description: GitHub Release tag to create/update. Defaults to desktop-<channel>-<date>-<run>.
        required: false
        type: string
      publish_release:
        description: Upload the Linux packages to a GitHub Release.
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark a newly-created workflow-dispatch release as a prerelease.
        required: true
        default: true
        type: boolean
      draft:
        description: Create a workflow-dispatch release as draft.
        required: true
        default: false
        type: boolean
      notify_website:
        description: Send a repository_dispatch to BharatCode website after release upload.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG_FROM_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_NAME_FROM_EVENT: ${{ github.event.release.name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG_FROM_EVENT"
            name="$RELEASE_NAME_FROM_EVENT"
            if [[ "$tag" == *dev* ]]; then
              channel="dev"
            elif [[ "$tag" == *prod* ]]; then
              channel="prod"
            elif [[ "$tag" == *beta* ]]; then
              channel="beta"
            elif [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
              channel="beta"
            else
              channel="prod"
            fi
          else
            channel="$INPUT_CHANNEL"
            tag="$INPUT_TAG"
            if [[ -z "$tag" ]]; then
              tag="desktop-$channel-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
            fi
            title_channel="$(tr '[:lower:]' '[:upper:]' <<< "${channel:0:1}")${channel:1}"
            name="BharatCode Desktop $title_channel $tag"
          fi

          if [[ -z "$name" ]]; then
            name="BharatCode Desktop $tag"
          fi

          if [[ "$channel" == "dev" ]]; then
            echo "::error::Refusing to publish dev-channel Linux artifacts."
            exit 1
          fi

          {
            echo "channel=$channel"
            echo "release_tag=$tag"
            echo "release_name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release for workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; assets will be updated."
            exit 0
          fi

          args=(
            release create "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_NAME"
            --notes "BharatCode Desktop Linux packages generated by GitHub Actions. Windows/macOS assets may be attached by their platform workflows."
          )
          if [[ "${{ inputs.draft }}" == "true" ]]; then args+=(--draft); fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then args+=(--prerelease); fi
          gh "${args[@]}"

  package-linux:
    name: Package Linux app
    needs: resolve-release
    runs-on: ubuntu-24.04
    env:
      BHARATCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
      OPENCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      VITE_OPENCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install setuptools
        run: python -m pip install setuptools

      - name: Install dependencies
        timeout-minutes: 20
        run: bun install --linker hoisted

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package Linux AppImage and Debian builds
        working-directory: packages/desktop
        run: bunx electron-builder --linux AppImage deb --x64 --config electron-builder.config.ts --publish never

      - name: Print Linux checksums
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 packages/desktop/dist/*.AppImage packages/desktop/dist/*.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bharatcode-desktop-linux-${{ env.BHARATCODE_CHANNEL }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb

      - name: Upload Linux packages to GitHub Release
        if: ${{ github.event_name == 'release' || inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages/desktop/dist -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.deb" \) | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No Linux release files found in packages/desktop/dist"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  notify-website:
    name: Notify website
    needs:
      - resolve-release
      - package-linux
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' || inputs.publish_release) && (github.event_name == 'release' || inputs.notify_website) }}
    env:
      BHARATCODE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      GH_TOKEN: ${{ secrets.BHARATCODE_WEBSITE_DISPATCH_TOKEN }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Notify website to redeploy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Skipping website notification; BHARATCODE_WEBSITE_DISPATCH_TOKEN is not configured."
            exit 0
          fi

          gh api repos/BharatCode-ai/bharatcode/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "desktop_release_published",
            "client_payload": {
              "repo": "$GITHUB_REPOSITORY",
              "tag": "$RELEASE_TAG",
              "channel": "$BHARATCODE_CHANNEL",
              "release_url": "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            }
          }
          EOF
