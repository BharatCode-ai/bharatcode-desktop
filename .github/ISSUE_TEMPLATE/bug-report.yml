name: Bug report
description: Report a BharatCode Desktop issue
title: "[bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not paste OAuth tokens, API keys, credential files, private prompts, private repository links, phone numbers, raw emails, or unredacted debug archives.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the user-visible issue.
      placeholder: BharatCode Desktop showed...
    validations:
      required: true

  - type: input
    id: desktop-version
    attributes:
      label: BharatCode Desktop version
      placeholder: e.g. 1.15.13
    validations:
      required: false

  - type: input
    id: channel
    attributes:
      label: Channel
      placeholder: beta, prod, or dev
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: false

  - type: input
    id: install-source
    attributes:
      label: Install source
      placeholder: e.g. website download, GitHub release, local build
    validations:
      required: false

  - type: input
    id: visible-error
    attributes:
      label: Visible error
      placeholder: Paste only the visible error text, with secrets removed
    validations:
      required: false

  - type: input
    id: approximate-time
    attributes:
      label: Approximate timestamp
      placeholder: e.g. 2026-06-20 10:15 IST
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: redacted-evidence
    attributes:
      label: Redacted logs or screenshots
      description: Attach screenshots or short log excerpts only after removing private data.
    validations:
      required: false
