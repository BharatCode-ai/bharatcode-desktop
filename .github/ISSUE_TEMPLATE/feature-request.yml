name: Feature request
description: Suggest an improvement for BharatCode Desktop
title: "[feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not paste OAuth tokens, API keys, credential files, private prompts, private repository links, phone numbers, raw emails, or unredacted debug archives.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What would you like BharatCode Desktop to do?
    validations:
      required: true
